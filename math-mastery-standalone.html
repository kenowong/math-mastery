<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>融会贯通 · 中小学数学教练</title>
  <style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --line:#e5e7eb; --primary:#2f6fed; --primary-d:#1e4fb0;
  scroll-behavior:smooth;
  --ok:#16a34a; --warn:#d97706; --lock:#9ca3af; --danger:#dc2626;
  --chip:#eef3ff; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; background:linear-gradient(90deg,#1e3a8a,#2f6fed); color:#fff; box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.brand-title{font-weight:700;font-size:16px;line-height:1.1}
.brand-sub{font-size:11px;opacity:.82}
.nav{display:flex;gap:6px;align-items:center}
.nav-link{color:#fff;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:8px;opacity:.9;position:relative}
.nav-link.active{background:rgba(255,255,255,.2);opacity:1;font-weight:600}
.badge{position:absolute;top:-4px;right:-6px;background:var(--danger);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;min-width:16px;text-align:center;display:none}
.badge.show{display:inline-block}
.view{max-width:920px;margin:0 auto;padding:16px}
.footpad{height:24px}

/* 卡片与通用 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
h2.section{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer;background:var(--primary);color:#fff;font-weight:600;transition:.15s}
.btn:hover{background:var(--primary-d)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.soft{background:var(--chip);color:var(--primary-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--primary-d);margin-right:6px}
.tag.g{background:#e7f6ee;color:var(--ok)}
.tag.w{background:#fdf0e3;color:var(--warn)}
.tag.l{background:#f1f3f5;color:var(--lock)}

/* 路径树 */
.tree{display:flex;flex-direction:column;gap:10px}
.node{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);position:relative}
.node.locked{opacity:.72;background:#fafafa}
.node.mastered{border-color:#bfe6cc}
/* 返回路径后，定位到的技巧节点高亮一下 */
@keyframes nodeFlash{0%{box-shadow:0 0 0 3px var(--primary);border-color:var(--primary)}100%{box-shadow:var(--shadow);border-color:var(--line)}}
.node.flash{animation:nodeFlash 1.8s ease-out}
.node .step{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--primary)}
.node.locked .step{background:var(--lock)}
.node.mastered .step{background:var(--ok)}
.node .body{flex:1;min-width:0}
.node .title{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.node .meta{font-size:12px;color:var(--muted);margin-top:2px}
.node .acts{margin-top:8px}
.status-pill{font-size:12px;padding:2px 9px;border-radius:20px}
.status-pill.lock{background:#f1f3f5;color:var(--lock)}
.status-pill.learn{background:var(--chip);color:var(--primary-d)}
.status-pill.done{background:#e7f6ee;color:var(--ok)}
.lock-ico{font-size:14px}
.grade-sep{margin:18px 0 6px;font-weight:700;color:var(--primary-d);font-size:14px;border-left:4px solid var(--primary);padding-left:8px}
.stage-banner{display:flex;align-items:baseline;gap:10px;margin:22px 0 4px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,#1e3a8a,#2f6fed);color:#fff;box-shadow:var(--shadow)}
.stage-banner.sm{margin:16px 0 2px;padding:6px 12px;background:#eef3ff}
.stage-name{font-weight:800;font-size:17px}
.stage-banner.sm .stage-name{font-size:15px;color:var(--primary-d)}
.stage-desc{font-size:12px;opacity:.85}
.stage-banner.sm .stage-desc{display:none}
.grade-tag{font-weight:700;color:var(--primary-d);font-size:14px}
.grade-count{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}

/* 学习页 */
.tech-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.kou{background:#fff8ec;border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;color:#8a5a00;font-size:14px;margin:10px 0}
.kou b{color:var(--warn)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{position:relative;padding:8px 8px 8px 38px;border-bottom:1px dashed var(--line)}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:6px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--primary-d);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.anim-wrap{background:#0f172a;border-radius:12px;padding:8px;margin:12px 0;position:relative;overflow:hidden}
.anim-wrap svg{width:100%;height:auto;display:block}
.anim-cap{color:#cbd5e1;font-size:12px;padding:6px 8px 2px}
.anim-ctrls{display:flex;gap:8px;flex-wrap:wrap;padding:6px 8px 10px}
.anim-ctrls .btn{background:#1e293b;color:#e2e8f0}
.anim-ctrls .btn:hover{background:#334155}

/* 练习 */
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.q .qtext{font-size:15px;font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--chip)}
.opt.correct{border-color:var(--ok);background:#e7f6ee}
.opt.wrong{border-color:var(--danger);background:#fdeaea}
.opt .mark{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.opt.correct .mark{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong .mark{background:var(--danger);color:#fff;border-color:var(--danger)}
.explain{background:#f8fafc;border-left:3px solid var(--primary);padding:8px 12px;margin-top:10px;font-size:13px;border-radius:0 8px 8px 0}
/* 判断题专用样式：✓ 对 / ✗ 错 并排两个大按钮，对绿错红 */
.opts.judge{flex-direction:row;gap:10px}
.opt.judge{flex:1;justify-content:center;font-weight:600;font-size:15px}
.opt.judge .mark.judge{width:26px;height:26px;font-size:16px;border:none}
.opt.judge:nth-child(1) .mark.judge{background:var(--ok);color:#fff}
.opt.judge:nth-child(2) .mark.judge{background:var(--danger);color:#fff}
.qfig{background:#fbfdff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:2px 0 12px;text-align:center}
.qfig svg{margin:0 auto}
.qres{font-weight:700;margin:6px 0}
/* 薄弱点复习：进度与即时反馈 */
.rev-prog{font-size:13px;color:var(--muted);margin:4px 0 10px}
.rev-prog b{color:var(--ink);font-size:15px}
.rev-note{margin-top:8px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px}
.rev-note.ok{background:#eafaf0;color:var(--ok)}
.rev-note.bad{background:#fdeeee;color:var(--danger)}
.q.cleared{border-color:#bfe9cd;background:#f6fdf8}

/* 进度 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:800;color:var(--primary)}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:#eee;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:13px;color:var(--muted);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}

/* 相关项目推荐 */
.res-cat{margin:0 0 6px;font-size:16px;color:var(--primary-d)}
.res-desc{font-size:13px;color:var(--muted);margin-bottom:12px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.res-item{display:block;text-decoration:none;background:#fbfdff;border:1px solid var(--line);border-radius:10px;padding:12px;transition:.12s}
.res-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.res-name{font-weight:700;font-size:15px;color:var(--ink)}
.res-tags{display:flex;gap:5px;flex-wrap:wrap}
.res-tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#eef3ff;color:var(--primary-d)}
.res-summary{font-size:13px;color:var(--ink);margin-bottom:8px;line-height:1.5}
.res-why{font-size:12px;color:var(--muted);line-height:1.5}
.res-why b{color:var(--warn)}
.res-url{font-size:11px;color:var(--primary);margin-top:8px;word-break:break-all}

@media(max-width:560px){
  .brand-sub{display:none}
  .nav-link{font-size:12px;padding:6px 7px;flex:0 0 auto}
  .view{padding:12px}
  .topbar{flex-wrap:wrap;padding:8px 12px}
  .brand{margin-right:auto}
  .nav{width:100%;justify-content:flex-start;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
}

/* 学习路径：侧边栏（学段 → 年级 两级） + 主区 */
.view.path-view{max-width:1200px}
.path-layout{display:flex;gap:16px;align-items:flex-start}
.path-main{flex:1;min-width:0}
.sidebar{width:218px;flex:0 0 218px;position:sticky;top:72px;align-self:flex-start;max-height:calc(100vh - 92px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sb-title{font-weight:700;font-size:13px;color:var(--primary-d)}
.sb-toggle{border:1px solid var(--line);background:#fff;border-radius:8px;width:26px;height:24px;cursor:pointer;color:var(--muted);font-size:13px;line-height:1}
.sb-toggle:hover{background:var(--chip)}
.sb-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px;margin-bottom:4px}
.sb-item:hover{background:var(--chip)}
.sb-item.active{background:var(--primary);color:#fff;font-weight:600}
.sb-stage{margin:4px 0}
.sb-stage-h{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;color:var(--primary-d);background:#f3f6fc;user-select:none}
.sb-stage-h:hover{background:#e8eefb}
.sb-caret{font-size:11px;color:var(--muted)}
.sb-cnt{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 6px}
.sb-grades{display:none;padding:4px 0 6px 6px;border-left:2px solid var(--line);margin:4px 0 4px 8px}
.sb-stage.open .sb-grades{display:block}
.sb-grade{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13px;margin:2px 0}
.sb-grade:hover{background:var(--chip)}
.sb-grade.active{background:var(--primary);color:#fff;font-weight:600}
.sb-grade.active .sb-cnt{color:#fff;background:rgba(255,255,255,.22);border-color:transparent}
.path-layout.sb-collapsed .sidebar{display:none}
.sb-fab{display:none}
.sb-top-btn{display:none;align-items:center;gap:6px;margin:0 0 10px;background:var(--chip);color:var(--primary-d);border:1px solid var(--primary);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.sb-top-btn:hover{background:#e6edff}
.sb-mask{display:none;position:fixed;inset:0;z-index:39}
@media (max-width:820px){
  .view.path-view{max-width:100%}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;max-height:none;border-radius:0;transform:translateX(-100%);transition:transform .2s ease;z-index:40;padding-top:14px}
  .path-layout.sb-drawer-open .sidebar{transform:translateX(0)}
  .path-layout.sb-drawer-open .sb-mask{visibility:visible}
  .sb-toggle{display:none}
  .sb-top-btn{display:inline-flex}
  .sb-mask{display:block;visibility:hidden}
  .sb-fab{display:inline-flex;align-items:center;gap:6px;position:fixed;left:10px;bottom:14px;z-index:41;background:var(--primary);color:#fff;border:none;border-radius:22px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
}

/* ===== 去学习 · 典型例题 ===== */
.ex-list{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.ex-q{font-size:15px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.ex-no{flex:0 0 auto;min-width:26px;height:26px;line-height:26px;text-align:center;background:#eef3ff;color:var(--primary);border-radius:7px;font-size:13px;font-weight:700}
.ex-opts{display:flex;flex-wrap:wrap;gap:8px}
.ex-opt{display:inline-flex;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:#f8fafc;font-size:14px;color:var(--ink)}
.ex-opt.correct{border-color:var(--ok);background:#eafaf0;color:#15803d;font-weight:700}
.ex-why{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ex-why summary{cursor:pointer;color:var(--primary);font-size:13px;font-weight:600;user-select:none;list-style:none;outline:none}
.ex-why summary::-webkit-details-marker{display:none}
.ex-why summary::before{content:"▸ ";color:var(--primary)}
.ex-why[open] summary::before{content:"▾ "}
.ex-exp{margin-top:8px;font-size:14px;color:var(--ink);line-height:1.6;background:#f8fafc;border-radius:8px;padding:8px 10px}
.ex-point{margin-top:6px;font-size:13px;color:var(--warn)}
.hint-inline{font-size:12px;color:var(--muted);font-weight:400}

/* ===== AI 知识漏洞诊断 ===== */
.diag-head .diag-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.diag-mastery{flex:0 0 auto;text-align:center;background:linear-gradient(135deg,#eef3ff,#e6edff);border-radius:14px;padding:10px 16px}
.diag-mastery .n{font-size:30px;font-weight:800;color:var(--primary);line-height:1.1}
.diag-mastery .l{font-size:12px;color:var(--muted)}
.diag-stats{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:13px;color:var(--ink)}
.diag-stats b{color:var(--primary);font-size:16px;margin-right:3px}
.diag-head .bar{margin-top:12px;height:9px}
.stage-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.stage-row .stage-name{flex:0 0 52px;font-weight:700;font-size:13px;color:var(--ink)}
.stage-row .bar.mini{flex:1 1 auto;height:8px;margin:0}
.stage-row .bar.mini i.warn{background:var(--warn)}
.stage-row .stage-num{flex:0 0 auto;font-size:12px;color:var(--muted)}
.diag-concl{background:linear-gradient(135deg,#fffaf0,#fff7e6);border-color:#ffe1a8}
.diag-concl h3{margin-top:0}
.diag-concl .muted{line-height:1.7;font-size:14px}
.diag-concl b{color:#b45309}
.diag-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.diag-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.diag-item .di-main{flex:1 1 auto;min-width:0}
.diag-item .di-name{font-size:14px;font-weight:700;color:var(--ink)}
.diag-item .di-meta{font-size:12px;color:var(--muted);margin-top:2px}
.tag.ok{background:#eafaf0;color:#15803d;border-color:#b7ebc6}
.tag.warn{background:#fff5e6;color:#b45309;border-color:#ffd79a}
.tag.bad{background:#fdecec;color:#c0392b;border-color:#f5b5b0}
@media (max-width:560px){
  .diag-stats{grid-template-columns:repeat(2,1fr)}
  .diag-mastery .n{font-size:26px}
}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">∑</span>
      <div>
        <div class="brand-title">融会贯通</div>
        <div class="brand-sub">中小学数学技巧教练</div>
      </div>
    </div>
    <nav class="nav">
      <a href="#/path" class="nav-link" data-route="path">学习路径</a>
      <a href="#/review" class="nav-link" data-route="review">薄弱点复习<span class="badge" id="weakBadge">0</span></a>
      <a href="#/progress" class="nav-link" data-route="progress">我的进度</a>
      <a href="#/ai" class="nav-link" data-route="ai">AI诊断</a>
      <a href="#/resources" class="nav-link" data-route="resources">相关项目</a>
    </nav>
  </header>

  <main id="view" class="view"><!-- 路由渲染区 --></main>

  <footer class="footpad"></footer>
  <div id="toast" class="toast"></div>

  <script>
/* ============================================================
 * 融会贯通 · 技巧库与题库（K-12 核心课程全景版）
 * 数据驱动：每个技巧含 名师口诀 / 解题步骤 / 前置依赖 / 动画类型 / 分层题库
 * 模块内按"通关门禁"线性递进；模块间相互独立，可并行进入。
 * 说明：覆盖小学到高中基础的全部核心知识点（持续可扩展），
 *      并非字面意义上"网络上每一道题"，但课程主干与名师解题套路已全纳入。
 * ============================================================ */
window.TECHNIQUES = [
  /* ===================== 小学 · 低年级 ===================== */
  {
    id: "count", grade: "一年级", stage: "小学", name: "数数与数位", anim: null,
    summary: "搞清数位顺序与计数单位，是全部运算的地基。",
    kou: "个十位，从右起；数位对齐再比较；满十进一要牢记。",
    steps: [
      "数位从右往左：个位、十位、百位、千位……",
      "比较大小先看<b>最高位</b>，高位大者大；相同再比下一位。",
      "10 个一是十，10 个十是百，满十进一。"
    ],
    prereq: null,

      "全微分：df = f_x dx + f_y dy。",
      "混合偏导连续时 ∂²f/∂x∂y = ∂²f/∂y∂x。"
    ],
    prereq: "derivative",
    questions: [
      { q: "f(x,y)=x²y，对 x 的偏导数 ∂f/∂x = ？", opts: ["2xy","x²","2x","y"], ans: 0, level: "基础",
        explain: "视 y 常数：2xy。", point: "偏导" },
      { q: "f(x,y)=x²y，对 y 的偏导数 ∂f/∂y = ？", opts: ["x²","2xy","2x","y"], ans: 0, level: "基础",
        explain: "视 x 常数：x²。", point: "偏导" },
      { q: "f(x,y)=x²+3xy，∂f/∂x 在 (1,2) 的值 = ？", opts: ["8","2","5","11"], ans: 0, level: "进阶",
        explain: "∂f/∂x=2x+3y，代入得 8。", point: "求值" },
      { q: "若二阶混合偏导连续，则 ∂²f/∂x∂y 与 ∂²f/∂y∂x 的关系是？", opts: ["相等","互为相反数","无关","相差一个常数"], ans: 0, level: "进阶",
        explain: "克莱罗定理：连续时相等。", point: "混合偏导" }
    ]
  },
  {
    id: "gradient", grade: "大学预科", stage: "高中", name: "梯度", anim: null,
    summary: "梯度 ∇f=(f_x, f_y) 指向函数增长最快方向，模为最大方向导数；与等高线垂直。",
    kou: "梯度指向升高处，模是最大方向导；垂直等高线，负梯度下降快。",
    steps: [
      "梯度 ∇f=(∂f/∂x, ∂f/∂y)，方向为增长最快方向。",
      "模 |∇f| = 最大方向导数；方向导数 D_u f = ∇f·u。",
      "梯度垂直等高线；最速下降沿 −∇f。"
    ],
    prereq: "derivative",
    questions: [
      { q: "f(x,y)=x²+y² 的梯度 ∇f = ？", opts: ["(2x, 2y)","(x,y)","(2,2)","(2x+2y)"], ans: 0, level: "基础",
        explain: "∇f=(2x, 2y)。", point: "梯度" },
      { q: "梯度 ∇f 的方向是？", opts: ["函数值增加最快的方向","减小最快的方向","等高线切线方向","任意方向"], ans: 0, level: "基础",
        explain: "梯度方向增长最快。", point: "方向" },
      { q: "梯度的模 |∇f| 等于？", opts: ["最大方向导数","函数值","零","偏导数之和"], ans: 0, level: "基础",
        explain: "|∇f| 为最大方向导数。", point: "模" },
      { q: "f(x,y)=xy 在 (1,1) 处的梯度 = ？", opts: ["(1,1)","(1,0)","(0,1)","(1,−1)"], ans: 0, level: "进阶",
        explain: "∇f=(y,x)，在 (1,1) 为 (1,1)。", point: "求值" }

  <script>
/* ============================================================
 * 融会贯通 · SVG 动图模块
 * 提供三种几何/算术动画：鸡兔同笼(假设法)、将军饮马(对称点)、瓜豆原理(轨迹)
 * 每个函数接收一个容器 DOM 节点，自行渲染 SVG 与交互控件。
 * ============================================================ */
window.Anim = (function () {
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

  /* ---------- 1. 鸡兔同笼：假设法(抬腿) ---------- */
  function chicken(box) {
    box.innerHTML = "";
    const H = 8, L = 22;                 // 8头22脚
    const rabbit = (L - 2 * H) / 2;      // 3
    const chickenN = H - rabbit;         // 5
    const svg = el("svg", { viewBox: "0 0 600 230" });
    const cap = document.createElement("div");
    cap.className = "anim-cap";
    cap.textContent = "点“演示”看假设法：先假设全是鸡（每头2脚），再让所有动物抬起2条腿，地上剩下的脚全是兔子的。";
    const ctrls = document.createElement("div");
    ctrls.className = "anim-ctrls";
    const btn = document.createElement("button");
    btn.className = "btn"; btn.textContent = "▶ 演示假设法";
    ctrls.appendChild(btn);

    // ground
    svg.appendChild(el("line", { x1: 20, y1: 200, x2: 580, y2: 200, stroke: "#94a3b8", "stroke-width": 2 }));
    const animals = [];
    const startX = 70, gap = 62, bodyY = 150;
    for (let i = 0; i < H; i++) {
      const cx = startX + i * gap;
      const g = el("g", {});
      // body
      g.appendChild(el("ellipse", { cx: cx, cy: bodyY, rx: 18, ry: 13, fill: "#60a5fa", stroke: "#1d4ed8", "stroke-width": 1.5 }));
      // head
      g.appendChild(el("circle", { cx: cx + 16, cy: bodyY - 16, r: 9, fill: "#fde68a", stroke: "#b45309", "stroke-width": 1.5 }));
      g.appendChild(el("circle", { cx: cx + 19, cy: bodyY - 18, r: 1.6, fill: "#1f2937" }));
      // 2 standing legs (chicken's natural 2 legs) — WHITE to stand out on dark bg
      const legL = el("line", { x1: cx - 6, y1: bodyY + 12, x2: cx - 6, y2: 200, stroke: "#f8fafc", "stroke-width": 3, "stroke-linecap": "round" });
      const legR = el("line", { x1: cx + 6, y1: bodyY + 12, x2: cx + 6, y2: 200, stroke: "#f8fafc", "stroke-width": 3, "stroke-linecap": "round" });
      // extra 2 legs (rabbit's additional 2) — ORANGE, hidden until revealed
      const legL2 = el("line", { x1: cx - 3, y1: bodyY + 12, x2: cx - 3, y2: 200, stroke: "#fb923c", "stroke-width": 3, "stroke-linecap": "round", opacity: 0 });
      const legR2 = el("line", { x1: cx + 3, y1: bodyY + 12, x2: cx + 3, y2: 200, stroke: "#fb923c", "stroke-width": 3, "stroke-linecap": "round", opacity: 0 });
      g.appendChild(legL2); g.appendChild(legR2); // orange behind
      g.appendChild(legL); g.appendChild(legR);     // white in front
      svg.appendChild(g);
      animals.push({ g, legL, legR, legL2, legR2 });
    }

    function liftAll(progress) {
      const ang = -160 * progress; // swing white legs way up so they're clearly "lifted"
      animals.forEach(a => {
        [a.legL, a.legR].forEach(lg => {
          const x = +lg.getAttribute("x1"), y = +lg.getAttribute("y1");
          lg.setAttribute("transform", `rotate(${ang} ${x} ${y})`);
        });
      });
    }
    function revealRabbits() {
      for (let i = 0; i < rabbit; i++) {
        animals[i].legL2.setAttribute("opacity", 1);
        animals[i].legR2.setAttribute("opacity", 1);
        // rabbit ears
        const cx = startX + i * gap;
        animals[i].g.appendChild(el("line", { x1: cx + 13, y1: bodyY - 24, x2: cx + 10, y2: bodyY - 38, stroke: "#f472b6", "stroke-width": 2.5, "stroke-linecap": "round" }));
        animals[i].g.appendChild(el("line", { x1: cx + 20, y1: bodyY - 24, x2: cx + 23, y2: bodyY - 38, stroke: "#f472b6", "stroke-width": 2.5, "stroke-linecap": "round" }));
      }
    }
    let step = 0;
    btn.onclick = () => {
      step++;
      if (step === 1) {
        cap.textContent = "第1步：假设全是鸡 → 8头 × 2脚 = 16 脚（地上站着 16 条腿）。";
      } else if (step === 2) {
        cap.textContent = "第2步：所有动物抬起 2 条腿（白色腿）→ 鸡已全部抬起；兔还剩 2 条橙色腿站立。";
        let p = 0; const t = setInterval(() => { p += 0.08; liftAll(Math.min(1, p)); if (p >= 1) clearInterval(t); }, 16);
      } else if (step === 3) {
        const remain = L - 2 * H;
        cap.textContent = `第3步：地上剩 ${remain} 条橙色腿，每只兔站 2 条 → 兔 = ${remain}÷2 = ${rabbit} 只；鸡 = ${H}−${rabbit} = ${chickenN} 只。验算：${chickenN}×2 + ${rabbit}×4 = ${chickenN*2+rabbit*4} = ${L} ✓`;
        revealRabbits();
        btn.disabled = true; btn.textContent = "✓ 完成";
      }
    };
    box.appendChild(svg); box.appendChild(cap); box.appendChild(ctrls);
  }

  /* ---------- 2. 将军饮马：对称点最短路（可拖动） ---------- */
  function general(box) {
    box.innerHTML = "";
    const svg = el("svg", { viewBox: "0 0 640 360" });
    const riverY = 190, x0 = 40, x1 = 600;
    const A = [180, 80], B = [450, 95];
    const Bp = [B[0], 2 * riverY - B[1]]; // 对称点
    // river
    svg.appendChild(el("rect", { x: x0, y: riverY, width: x1 - x0, height: 26, fill: "#0ea5e9", opacity: 0.25 }));
    svg.appendChild(el("line", { x1: x0, y1: riverY + 13, x2: x1, y2: riverY + 13, stroke: "#38bdf8", "stroke-width": 2 }));
    // optimal line A-B'
    const Mstar = lineIntersectX(A, Bp, riverY);
    svg.appendChild(el("line", { x1: A[0], y1: A[1], x2: Bp[0], y2: Bp[1], stroke: "#facc15", "stroke-width": 1.5, "stroke-dasharray": "6 5", opacity: 0.8 }));
    // B' (reflection)
    svg.appendChild(el("circle", { cx: Bp[0], cy: Bp[1], r: 6, fill: "#94a3b8" }));
    const lblBp = el("text", { x: Bp[0] + 10, y: Bp[1] + 4, fill: "#cbd5e1", "font-size": 13 }); lblBp.textContent = "B′(对称点)"; svg.appendChild(lblBp);
    // A, B
    svg.appendChild(el("circle", { cx: A[0], cy: A[1], r: 7, fill: "#22c55e" }));
    const lblA = el("text", { x: A[0] - 8, y: A[1] - 12, fill: "#cbd5e1", "font-size": 13 }); lblA.textContent = "A"; svg.appendChild(lblA);
    svg.appendChild(el("circle", { cx: B[0], cy: B[1], r: 7, fill: "#f97316" }));
    const lblB = el("text", { x: B[0] + 10, y: B[1] - 10, fill: "#cbd5e1", "font-size": 13 }); lblB.textContent = "B"; svg.appendChild(lblB);
    // path A-M and M-B
    const pathAM = el("line", { x1: A[0], y1: A[1], x2: Mstar, y2: riverY + 13, stroke: "#e2e8f0", "stroke-width": 2 });
    const pathMB = el("line", { x1: Mstar, y1: riverY + 13, x2: B[0], y2: B[1], stroke: "#e2e8f0", "stroke-width": 2 });
    svg.appendChild(pathAM); svg.appendChild(pathMB);
    // M
    const M = el("circle", { cx: Mstar, cy: riverY + 13, r: 9, fill: "#fff", stroke: "#22c55e", "stroke-width": 3, style: "cursor:grab" });
    svg.appendChild(M);

    const cap = document.createElement("div"); cap.className = "anim-cap";
    const info = document.createElement("div"); info.className = "anim-cap"; info.style.color = "#facc15";
    function update(mx) {
      mx = Math.max(x0 + 10, Math.min(x1 - 10, mx));
      const m = [mx, riverY + 13];
      M.setAttribute("cx", mx);
      pathAM.setAttribute("x2", mx); pathMB.setAttribute("x1", mx);
      const s = dist(A, m) + dist(m, B);
      const best = dist(A, Bp);
      const diff = (s - best);
      cap.textContent = `当前 PA+PB = ${s.toFixed(0)}，理论最短(AB′) = ${best.toFixed(0)}`;
      if (diff < 2.5) { info.textContent = "✓ 已落在最短点：作 B 关于河岸的对称点 B′，连 A B′ 与河岸交点即最优。"; cap.style.color = "#86efac"; }
      else { info.textContent = ""; cap.style.color = "#cbd5e1"; }
    }
    update(Mstar);
    // drag
    let drag = false;
    function pos(e) { const r = svg.getBoundingClientRect(); const sx = 640 / r.width; return (e.clientX - r.left) * sx; }
    M.addEventListener("pointerdown", e => { drag = true; M.setAttribute("style", "cursor:grabbing"); M.setPointerCapture(e.pointerId); });
    svg.addEventListener("pointermove", e => { if (drag) update(pos(e)); });
    svg.addEventListener("pointerup", () => { drag = false; M.setAttribute("style", "cursor:grab"); });

    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const b1 = document.createElement("button"); b1.className = "btn"; b1.textContent = "⤴ 跳到最短点";
    b1.onclick = () => update(Mstar);
    ctrls.appendChild(b1);
    box.appendChild(svg); box.appendChild(cap); box.appendChild(info); box.appendChild(ctrls);

    function lineIntersectX(p, q, y) {
      // 直线 pq 与水平线 y 的交点 x
      const t = (y - p[1]) / (q[1] - p[1]);
      return p[0] + t * (q[0] - p[0]);
    }
  }

  /* ---------- 3. 瓜豆原理：主动点走圆，从动点同形走圆 ---------- */
  function melon(box) {
    box.innerHTML = "";
    const svg = el("svg", { viewBox: "0 0 600 360" });
    const O = [210, 180], R = 80, theta = 60 * Math.PI / 180, k = 1.4;
    // P 轨迹圆
    svg.appendChild(el("circle", { cx: O[0], cy: O[1], r: R, fill: "none", stroke: "#38bdf8", "stroke-width": 1.5, "stroke-dasharray": "4 4" }));
    const lblO = el("text", { x: O[0] - 4, y: O[1] + 4, fill: "#cbd5e1", "font-size": 13 }); lblO.textContent = "O"; svg.appendChild(lblO);
    svg.appendChild(el("circle", { cx: O[0], cy: O[1], r: 3, fill: "#cbd5e1" }));
    // Q 轨迹圆（半径 kR）
    svg.appendChild(el("circle", { cx: O[0], cy: O[1], r: R * k, fill: "none", stroke: "#f472b6", "stroke-width": 1.5, "stroke-dasharray": "4 4" }));
    // OQ 连线参考
    const opLine = el("line", { x1: O[0], y1: O[1], x2: O[0] + R, y2: O[1], stroke: "#475569", "stroke-width": 1 });
    svg.appendChild(opLine);
    const oqLine = el("line", { x1: O[0], y1: O[1], x2: O[0] + R * k, y2: O[1], stroke: "#475569", "stroke-width": 1 });
    svg.appendChild(oqLine);
    // P, Q dots
    const P = el("circle", { cx: O[0] + R, cy: O[1], r: 7, fill: "#38bdf8" });
    const Q = el("circle", { cx: O[0] + R * k, cy: O[1], r: 7, fill: "#f472b6" });
    svg.appendChild(P); svg.appendChild(Q);
    const lblP = el("text", { x: O[0] + R + 8, y: O[1] - 8, fill: "#7dd3fc", "font-size": 13 }); lblP.textContent = "豆 P"; svg.appendChild(lblP);
    const lblQ = el("text", { x: O[0] + R * k - 6, y: O[1] + 22, fill: "#f9a8d4", "font-size": 13 }); lblQ.textContent = "瓜 Q"; svg.appendChild(lblQ);

    const cap = document.createElement("div"); cap.className = "anim-cap";
    cap.textContent = "豆 P 绕 O 走圆；瓜 Q 由 P 绕 O 旋转 60° 并放大 1.4 倍得到 → Q 也走一个圆（轨迹同形）。点击暂停/继续。";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    let playing = true;
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "⏸ 暂停";
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? "⏸ 暂停" : "▶ 继续"; };
    ctrls.appendChild(btn);

    box.appendChild(svg); box.appendChild(cap); box.appendChild(ctrls);

    let ang = 0;
    function frame() {
      if (playing) ang += 0.012;
      const px = O[0] + R * Math.cos(ang), py = O[1] + R * Math.sin(ang);
      // Q = O + k * Rot(theta) * (P-O)
      const dx = px - O[0], dy = py - O[1];
      const rx = dx * Math.cos(theta) - dy * Math.sin(theta);
      const ry = dx * Math.sin(theta) + dy * Math.cos(theta);
      const qx = O[0] + k * rx, qy = O[1] + k * ry;
      P.setAttribute("cx", px); P.setAttribute("cy", py);
      Q.setAttribute("cx", qx); Q.setAttribute("cy", qy);
      opLine.setAttribute("x2", px); opLine.setAttribute("y2", py);
      oqLine.setAttribute("x2", qx); oqLine.setAttribute("y2", qy);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 4. 函数图像：一次函数/二次函数（可拖动调参） ---------- */
  function func(box) {
    box.innerHTML = "";
    const svg = el("svg", { viewBox: "0 0 600 360" });
    const W = 600, H = 360, cx = 60, cy = 300; // 原点
    const sx = 50, sy = 40;                      // 比例尺：x每单位50px, y每单位40px
    // 坐标轴
    svg.appendChild(el("line", { x1: 0, y1: cy, x2: W, y2: cy, stroke: "#64748b", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 0, x2: cx, y2: H, stroke: "#64748b", "stroke-width": 1.5 }));
    const lblx = el("text", { x: W - 16, y: cy - 6, fill: "#94a3b8", "font-size": 12 }); lblx.textContent = "x"; svg.appendChild(lblx);
    const lbly = el("text", { x: cx + 6, y: 12, fill: "#94a3b8", "font-size": 12 }); lbly.textContent = "y"; svg.appendChild(lbly);
    // 网格刻度
    for (let i = 1; i <= 10; i++) svg.appendChild(el("line", { x1: cx + i * sx, y1: cy - 3, x2: cx + i * sx, y2: cy + 3, stroke: "#475569" }));
    for (let i = 1; i <= 6; i++) svg.appendChild(el("line", { x1: cx - 3, y1: cy - i * sy, x2: cx + 3, y2: cy - i * sy, stroke: "#475569" }));

    let k = 1, b = 0, quad = false;
    const path = el("path", { d: "", fill: "none", stroke: "#22d3ee", "stroke-width": 3 });
    svg.appendChild(path);
    function px(x) { return cx + x * sx; }
    function py(y) { return cy - y * sy; }
    function draw() {
      if (!quad) {
        let d = "";
        for (let x = -cx / sx; x <= (W - cx) / sx; x += 0.05) {
          const y = k * x + b; const X = px(x), Y = py(y);
          d += (d ? "L" : "M") + X.toFixed(1) + " " + Y.toFixed(1) + " ";
        }
        path.setAttribute("d", d);
      } else {
        let d = "";
        for (let x = -cx / sx; x <= (W - cx) / sx; x += 0.05) {
          const y = k * x * x + b; const X = px(x), Y = py(y);
          if (Y < -20 || Y > H + 20) { d += ""; continue; }
          d += (d ? "L" : "M") + X.toFixed(1) + " " + Y.toFixed(1) + " ";
        }
        path.setAttribute("d", d);
      }
    }
    draw();

    const cap = document.createElement("div"); cap.className = "anim-cap";
    const info = document.createElement("div"); info.className = "anim-cap"; info.style.color = "#22d3ee";
    function updateInfo() {
      if (quad) info.textContent = `当前：y = ${k}x² + ${b}，${k > 0 ? "开口向上" : "开口向下"}`;
      else info.textContent = `当前：y = ${k}x + ${b}，斜率 k=${k}（${k > 0 ? "上升" : k < 0 ? "下降" : "水平"}），截距 b=${b}`;
    }
    updateInfo();

    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const bK = btn2("k −0.5"); bK.onclick = () => { k = Math.round((k - 0.5) * 10) / 10; draw(); updateInfo(); };
    const aK = btn2("k +0.5"); aK.onclick = () => { k = Math.round((k + 0.5) * 10) / 10; draw(); updateInfo(); };
    const bB = btn2("b −1"); bB.onclick = () => { b = Math.round((b - 1) * 10) / 10; draw(); updateInfo(); };
    const aB = btn2("b +1"); aB.onclick = () => { b = Math.round((b + 1) * 10) / 10; draw(); updateInfo(); };
    const togg = btn2("切换 一次/二次"); togg.onclick = () => { quad = !quad; k = quad ? 1 : 1; b = 0; draw(); updateInfo(); };
    ctrls.appendChild(bK); ctrls.appendChild(aK); ctrls.appendChild(bB); ctrls.appendChild(aB); ctrls.appendChild(togg);
    box.appendChild(svg); box.appendChild(cap); box.appendChild(info); box.appendChild(ctrls);
    cap.textContent = "拖动下方按钮调节 斜率 k 与 截距 b（或切换二次函数），观察图像如何随参数变化。";

    function btn2(t) { const b = document.createElement("button"); b.className = "btn sm"; b.textContent = t; return b; }
  }

  /* ---------- 5. 动点问题：点沿矩形边移动，实时看 AP 距离与扫过面积 ---------- */
  function move(box) {
    box.innerHTML = "";
    const svg = el("svg", { viewBox: "0 0 600 320" });
    // 矩形 A(80,60) B(520,60) C(520,240) D(80,240)  — 动点 P 从 A 沿边到 C
    const A = [80, 60], Bp = [520, 60], C = [520, 240], D = [80, 240];
    const rect = el("polygon", { points: `${A} ${Bp} ${C} ${D}`.replace(/,/g, " "), fill: "rgba(56,189,248,0.08)", stroke: "#38bdf8", "stroke-width": 2 });
    // 注意 points 格式：用空格分隔坐标对
    rect.setAttribute("points", `${A[0]},${A[1]} ${Bp[0]},${Bp[1]} ${C[0]},${C[1]} ${D[0]},${D[1]}`);
    svg.appendChild(rect);
    function dot(p, c, r) { const e = el("circle", { cx: p[0], cy: p[1], r: r || 6, fill: c }); svg.appendChild(e); return e; }
    dot(A, "#22c55e"); dot(Bp, "#64748b"); dot(C, "#64748b"); dot(D, "#64748b");

      if (timer) { clearInterval(timer); timer = null; btn.textContent = "▶ 旋转演示"; return; }
      btn.textContent = "⏸ 暂停";
      timer = setInterval(() => { theta += 0.06; if (theta > 2 * Math.PI) theta -= 2 * Math.PI; draw(theta); }, 40);
    };
    draw(0);
    box.appendChild(svg); box.appendChild(cap); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：泰勒级数（多项式逼近 e^x） ---------- */
  function taylor(box) {
    box.innerHTML = "";
    const W = 360, H = 240, cx = 40, cy = 200;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: cx, y1: 10, x2: cx, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    const X = v => cx + v * 30;
    const Y = v => { let w = v; if (w > 11) w = 11; return cy - w * 14; };
    function poly(fn, color, w) {
      let pts = [];
      for (let i = -1.2; i <= 3.0001; i += 0.1) { let v = fn(i); if (v > 11) v = 11; pts.push([X(i), Y(v)]); }
      svg.appendChild(el("polyline", { points: pts.map(p => p[0] + "," + p[1]).join(" "), fill: "none", stroke: color, "stroke-width": w }));
    }
    poly(Math.exp, "#2f6fed", 2.5);
    const approx = order => x => { let s = 0, f = 1; for (let k = 0; k <= order; k++) { s += Math.pow(x, k) / f; f *= (k + 1); } return s; };
    let order = 1;
    const ap = el("polyline", { fill: "none", stroke: "#d97706", "stroke-width": 2.5 });
    svg.appendChild(ap);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    function draw() {
      let pts = [];
      for (let i = -1.2; i <= 3.0001; i += 0.1) { let v = approx(order)(i); if (v > 11) v = 11; pts.push([X(i), Y(v)]); }
      ap.setAttribute("points", pts.map(p => p[0] + "," + p[1]).join(" "));
      const terms = [];
      for (let k = 0; k <= order; k++) terms.push(k === 0 ? "1" : (k === 1 ? "x" : "x^" + k + "/" + k + "!"));
      info.textContent = `P${order}(x) = ` + terms.join(" + ") + "（蓝：e^x，橙：近似）";
      btn.textContent = "阶数 +1（当前 " + order + "）";
    }
    btn.onclick = () => { order = order >= 5 ? 1 : order + 1; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：数形结合（象限定位） ---------- */
  function numshape(box) {
    box.innerHTML = "";
    const W = 300, H = 300, cx = 150, cy = 150;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:300px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 20, y1: cy, x2: 280, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: 280, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("rect", { x: 20, y: 20, width: cx - 20, height: cy - 20, fill: "#eef3ff" }));
    const dot = el("circle", { cx: cx - 50, cy: cy - 60, r: 6, fill: "#d97706" });
    const label = el("text", { x: 30, y: 30, fill: "#334155", "font-size": 14 });
    svg.appendChild(dot); svg.appendChild(label);
    const pts = [[-2, 3, "第二象限"], [2, 3, "第一象限"], [-2, -3, "第三象限"], [2, -2, "第四象限"]];
    let i = 0;
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    function draw() {
      const [x, y, name] = pts[i];
      dot.setAttribute("cx", cx + x * 22); dot.setAttribute("cy", cy - y * 22);
      label.textContent = `点 (${x}, ${y}) 在${name}`;
      info.textContent = "数形结合：横坐标定左右，纵坐标定上下。";
    }
    btn.onclick = () => { i = (i + 1) % pts.length; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：树状图法（逐步生长） ---------- */
  function tree(box) {
    box.innerHTML = "";
    const W = 320, H = 220;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:320px;height:auto;display:block" });
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 逐步生长";
    const root = { x: 40, y: 110 };
    const L1 = [{ x: 130, y: 66 }, { x: 130, y: 154 }];
    const L2 = [{ x: 226, y: 40 }, { x: 226, y: 92 }, { x: 226, y: 128 }, { x: 226, y: 180 }];
    const edges = [[root, L1[0]], [root, L1[1]], [L1[0], L2[0]], [L1[0], L2[1]], [L1[1], L2[2]], [L1[1], L2[3]]];
    const nodes = [root, ...L1, ...L2];
    const labels = ["开始", "选①", "选②", "①·A", "①·B", "②·A", "②·B"];
    let step = 0, timer = null;
    function render() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      const layerOf = i => i === 0 ? 0 : (i <= 2 ? 1 : 2);
      edges.forEach((e, i) => {
        const layer = i < 2 ? 1 : 2;
        if (step >= layer) svg.appendChild(el("line", { x1: e[0].x, y1: e[0].y, x2: e[1].x, y2: e[1].y, stroke: "#cbd5e1", "stroke-width": 2 }));
      });
      nodes.forEach((n, i) => {
        const layer = layerOf(i);
        if (step >= layer) {
          svg.appendChild(el("circle", { cx: n.x, cy: n.y, r: 14, fill: "#eef3ff", stroke: "#2f6fed", "stroke-width": 1.5 }));
          const t = el("text", { x: n.x - 12, y: n.y + 4, "font-size": 11, fill: "#334155" });
          t.textContent = labels[i];
          svg.appendChild(t);
        }
      });
      info.textContent = step === 0 ? "根节点" : step === 1 ? "第一层分支：2 种选择" : "第二层展开 → 2 × 2 = 4 种结果";
    }
    function advance() { step = step >= 2 ? 0 : step + 1; render(); }
    btn.onclick = () => { if (timer) { clearInterval(timer); timer = null; btn.textContent = "▶ 逐步生长"; return; } btn.textContent = "⏸ 自动"; timer = setInterval(advance, 900); };
    render();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：线性规划（目标线平移） ---------- */
  function linearprog(box) {
    box.innerHTML = "";
    const W = 320, H = 240, ox = 30, oy = 210;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:320px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: ox, y1: 20, x2: ox, y2: oy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: ox, y1: oy, x2: 300, y2: oy, stroke: "#334155", "stroke-width": 1.5 }));
    const sx = v => ox + v * 42, sy = v => oy - v * 42;
    svg.appendChild(el("polygon", { points: `${sx(0)},${sy(0)} ${sx(4)},${sy(0)} ${sx(0)},${sy(4)}`, fill: "#eef3ff", stroke: "#2f6fed", "stroke-width": 1.5 }));
    [[0, 4, "(0,4)"], [4, 0, "(4,0)"], [0, 0, "(0,0)"]].forEach(p => {
      svg.appendChild(el("circle", { cx: sx(p[0]), cy: sy(p[1]), r: 4, fill: "#dc2626" }));
      const t = el("text", { x: sx(p[0]) + (p[0] === 0 ? 6 : -30), y: sy(p[1]) + (p[1] === 0 ? 16 : -6), "font-size": 11, fill: "#dc2626" });
      t.textContent = p[2]; svg.appendChild(t);
    });
    const line = el("line", { x1: sx(0), y1: sy(0), x2: sx(0), y2: sy(0), stroke: "#d97706", "stroke-width": 2.5 });
    svg.appendChild(line);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    let c = 0, timer = null;
    function draw() {
      const cc = Math.min(c, 4);
      line.setAttribute("x1", sx(0)); line.setAttribute("y1", sy(cc));
      line.setAttribute("x2", sx(cc)); line.setAttribute("y2", sy(0));
      info.textContent = `目标线 x+y = ${cc.toFixed(1)}：z 随高度增大，在顶点 (0,4) 处最大 = 4`;
      btn.textContent = `▶ 平移目标线（z=${cc.toFixed(1)}）`;
    }
    btn.onclick = () => { if (timer) { clearInterval(timer); timer = null; btn.textContent = "▶ 平移"; return; } btn.textContent = "⏸ 暂停"; timer = setInterval(() => { c += 0.4; if (c > 4.3) c = 0; draw(); }, 120); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：正态分布 3σ 区间阴影 ---------- */
  function normal(box) {
    box.innerHTML = "";
    const W = 360, H = 200, cx = 180, cy = 170, sigma = 55;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 10, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    const shade = el("rect", { x: cx, y: 20, width: 0, height: cy - 20, fill: "#eef3ff" });
    svg.appendChild(shade);
    let pts = [];
    for (let i = 0; i <= 160; i++) { const x = 10 + i * 2.125; const t = (x - cx) / sigma; pts.push([x, cy - 130 * Math.exp(-t * t / 2)]); }
    svg.appendChild(el("polyline", { points: pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "), fill: "none", stroke: "#2f6fed", "stroke-width": 2.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: cy, stroke: "#64748b", "stroke-dasharray": "3 3" }));
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    let k = 1;
    function draw() {
      const half = k * sigma;
      shade.setAttribute("x", cx - half); shade.setAttribute("width", half * 2);
      const map = { 1: "约 68.27%（[μ−σ, μ+σ]）", 2: "约 95.45%（[μ−2σ, μ+2σ]）", 3: "约 99.74%（[μ−3σ, μ+3σ]）" };
      info.textContent = "3σ 原则：" + map[k];
      btn.textContent = "切换区间（当前 " + k + "σ）";
    }
    btn.onclick = () => { k = k >= 3 ? 1 : k + 1; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：复数乘 i 旋转 ---------- */
  function cgeo(box) {
    box.innerHTML = "";
    const W = 300, H = 240, cx = 150, cy = 130, radius = Math.sqrt(60 * 60 + 50 * 50);
    let theta = Math.atan2(50, 60);
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:300px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 20, y1: cy, x2: 280, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: 230, stroke: "#334155", "stroke-width": 1.5 }));
    const line = el("line", { x1: cx, y1: cy, x2: cx + 60, y2: cy - 50, stroke: "#2f6fed", "stroke-width": 2 });
    const dot = el("circle", { cx: cx + 60, cy: cy - 50, r: 6, fill: "#2f6fed" });
    const label = el("text", { x: cx + 70, y: cy - 55, fill: "#334155", "font-size": 13 });
    svg.appendChild(line); svg.appendChild(dot); svg.appendChild(label);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 乘 i（逆时针转 90°）";
    function draw() {
      const x = cx + radius * Math.cos(theta), y = cy - radius * Math.sin(theta);
      dot.setAttribute("cx", x.toFixed(1)); dot.setAttribute("cy", y.toFixed(1));
      line.setAttribute("x2", x.toFixed(1)); line.setAttribute("y2", y.toFixed(1));
      const a = Math.round(radius * Math.cos(theta)), b = Math.round(radius * Math.sin(theta));
      label.textContent = `z = ${a} + ${b}i`;
      info.textContent = "复数乘 i：辐角 +π/2，即逆时针旋转 90°。";
    }
    btn.onclick = () => { theta += Math.PI / 2; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：重要极限 sinx/x → 1 ---------- */
  function lim(box) {
    box.innerHTML = "";
    const W = 360, H = 200, cx = 180, cy = 150;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 10, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: 190, stroke: "#334155", "stroke-width": 1.5 }));
    const poly = el("polyline", { fill: "none", stroke: "#2f6fed", "stroke-width": 2.5 });
    svg.appendChild(poly);
    const y1 = el("line", { x1: 10, y1: cy - 50, x2: 350, y2: cy - 50, stroke: "#16a34a", "stroke-dasharray": "4 3" });
    svg.appendChild(y1);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 让 x→0";
    let k = 1;
    function draw() {
      const span = 2.6 / k;
      let pts = [];
      for (let i = 0; i <= 120; i++) { const x = -span + i * (2 * span / 120); const px = cx + x * 60; let v = x === 0 ? 1 : Math.sin(x) / x; const py = cy - 50 * v; pts.push(px.toFixed(1) + "," + py.toFixed(1)); }
      poly.setAttribute("points", pts.join(" "));
      info.textContent = "x 区间 ±" + span.toFixed(2) + " 时，曲线在极限值 1（绿线）附近收敛。";
      btn.textContent = "▶ 让 x→0（当前 ×" + k + "）";
    }
    btn.onclick = () => { k = k >= 6 ? 1 : k + 1; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：函数图像变换 ---------- */
  function gtrans(box) {
    box.innerHTML = "";
    const W = 360, H = 220, cy = 180;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 10, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    const base = el("path", { fill: "none", stroke: "#94a3b8", "stroke-width": 2 });
    const moved = el("path", { fill: "none", stroke: "#2f6fed", "stroke-width": 2.5 });
    svg.appendChild(base); svg.appendChild(moved);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    let k = 0;
    const modes = [
      { name: "右移 a：y=f(x−a)", dx: 60, f: x => cy - 40 * Math.exp(-((x - 150 - 60) * (x - 150 - 60)) / 2000) },
      { name: "关于 y 轴：y=f(−x)", dx: 0, f: x => cy - 40 * Math.exp(-((150 - x) * (150 - x)) / 2000) },
      { name: "纵向拉伸 2 倍", dx: 0, f: x => cy - 80 * Math.exp(-((x - 150) * (x - 150)) / 2000) }
    ];
    function draw() {
      const m = modes[k % 3];
      let b = [], mv = [];
      for (let x = 20; x <= 340; x += 4) { b.push(x + "," + (cy - 40 * Math.exp(-((x - 150) * (x - 150)) / 2000)).toFixed(1)); mv.push(x + "," + m.f(x).toFixed(1)); }
      base.setAttribute("d", "M " + b.join(" L "));
      moved.setAttribute("d", "M " + mv.join(" L "));
      info.textContent = m.name;
      btn.textContent = "▶ 切换变换（" + ((k % 3) + 1) + "/3）";
    }
    btn.onclick = () => { k = (k + 1) % 3; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  return { chicken, general, melon, func, move, trip, geo, solid, conic, euler, taylor, numshape, tree, linearprog, normal, cgeo, lim, gtrans };
})();

  <script>
/* ============================================================
 * 融会贯通 · 题目配图库
 * window.Fig:   名字 -> 生成 SVG 的函数（返回 svg 字符串）
 * window.QFIG:  技巧id -> 配图规格（字符串 或 按题目下标的数组）
 * 渲染见 app.js 的 qfigSVG()：优先用题目自带的 q.fig，否则回退 QFIG。
 * 颜色跟随浅色主题（蓝 / 灰 / 强调）。
 * ============================================================ */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const K = {
    ink: "#334155", sub: "#64748b", line: "#cbd5e1", grid: "#e2e8f0",
    pri: "#2f6fed", ok: "#16a34a", warn: "#d97706", red: "#dc2626",
    fill: "#f8fafc", soft: "#eef3ff", orange: "#ea580c", green: "#16a34a",
    blue: "#2563eb", purple: "#7c3aed"
  };
  function S(w, h, inner, maxw) {
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${maxw || w}px;height:auto;display:block" xmlns="${NS}">${inner}</svg>`;
  }

  const Fig = {};

  /* ---------------- 数轴 ---------------- */
  Fig.numline = function (p) {
    p = p || {};
    const min = p.min != null ? p.min : 0, max = p.max != null ? p.max : 10;
    const x0 = 34, x1 = 286, y = 96;
    const sx = v => x0 + (v - min) / (max - min) * (x1 - x0);
    let s = `<line x1="${x0}" y1="${y}" x2="${x1 + 14}" y2="${y}" stroke="${K.ink}" stroke-width="2"/>`;
    s += `<path d="M ${x1} ${y} L ${x1 + 14} ${y - 5} L ${x1 + 14} ${y + 5} Z" fill="${K.ink}"/>`;
    for (let v = min; v <= max; v++) {
      const x = sx(v);
      s += `<line x1="${x}" y1="${y - 5}" x2="${x}" y2="${y + 5}" stroke="${K.sub}" stroke-width="1.5"/>`;
      s += `<text x="${x}" y="${y + 22}" font-size="11" fill="${K.sub}" text-anchor="middle" font-family="inherit">${v}</text>`;
    }
    (p.pts || []).forEach(pt => {
      const x = sx(pt.v);
      s += `<circle cx="${x}" cy="${y}" r="5" fill="${pt.color || K.pri}"/>`;
      s += `<text x="${x}" y="${y - 12}" font-size="12" fill="${K.ink}" text-anchor="middle" font-weight="700" font-family="inherit">${pt.label || pt.v}</text>`;
    });
    return S(320, 140, s, 320);
  };

  /* ---------------- 线段 ---------------- */
  Fig.seg = function (p) {
    p = p || {};
    const a = p.a || "A", b = p.b || "B";
    const x1 = 50, x2 = 270, y = 80;
    let s = `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${K.ink}" stroke-width="3"/>`;
    s += `<circle cx="${x1}" cy="${y}" r="5" fill="${K.pri}"/>`;
    s += `<circle cx="${x2}" cy="${y}" r="5" fill="${K.pri}"/>`;
    s += `<text x="${x1}" y="${y - 14}" font-size="13" fill="${K.pri}" font-weight="700" text-anchor="middle" font-family="inherit">${a}</text>`;
    s += `<text x="${x2}" y="${y - 14}" font-size="13" fill="${K.pri}" font-weight="700" text-anchor="middle" font-family="inherit">${b}</text>`;
    if (p.label) s += `<text x="${(x1 + x2) / 2}" y="${y + 24}" font-size="13" fill="${K.ink}" text-anchor="middle" font-family="inherit">${p.label}</text>`;
    return S(320, 120, s, 320);
  };

  /* ---------------- 角 ---------------- */
  function angleInner(deg, label, bis) {
    const vx = 60, vy = 130, r = 90;
    const a1 = 0, a2 = -deg * Math.PI / 180;
    const x2 = vx + r * Math.cos(a1), y2 = vy + r * Math.sin(a1);
    const x3 = vx + r * Math.cos(a2), y3 = vy + r * Math.sin(a2);
    let s = `<line x1="${vx}" y1="${vy}" x2="${x2}" y2="${y2}" stroke="${K.ink}" stroke-width="2.5"/>`;
    s += `<line x1="${vx}" y1="${vy}" x2="${x3}" y2="${y3}" stroke="${K.ink}" stroke-width="2.5"/>`;
    const ar = 34;
    s += `<path d="M ${vx + ar} ${vy} A ${ar} ${ar} 0 0 0 ${vx + ar * Math.cos(a2)} ${vy + ar * Math.sin(a2)}" fill="none" stroke="${K.warn}" stroke-width="1.5"/>`;
    s += `<text x="${vx + 14}" y="${vy - 10}" font-size="12" fill="${K.warn}" text-anchor="middle" font-family="inherit">${label || deg + "°"}</text>`;
    if (bis) {
      const am = (a1 + a2) / 2;
      s += `<line x1="${vx}" y1="${vy}" x2="${vx + (r + 6) * Math.cos(am)}" y2="${vy + (r + 6) * Math.sin(am)}" stroke="${K.ok}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      s += `<text x="${vx + (r + 18) * Math.cos(am)}" y="${vy + (r + 18) * Math.sin(am)}" font-size="11" fill="${K.ok}" text-anchor="middle" font-family="inherit">平分线</text>`;

  Fig.angle = function (p) { p = p || {}; return S(320, 160, angleInner(p.deg || 60, p.label, false), 320); };
  Fig.bisector = function (p) { p = p || {}; return S(320, 160, angleInner(p.deg || 60, p.label, true), 320); };
  Fig.supp = function () {
    const vx = 60, vy = 90, r = 90;

  /* ---------------- 三角形 ---------------- */
  function triPath(type) {
    // 返回 {pts:[{x,y}], right:{x,y}, marks:[{a,b,t}]}
    const A = { x: 60, y: 130 }, B = { x: 250, y: 130 }, C = { x: 150, y: 40 };
    if (type === "iso") { C.x = 155; C.y = 45; }
    if (type === "right") { return { A: { x: 60, y: 130 }, B: { x: 230, y: 130 }, C: { x: 60, y: 40 }, right: { x: 60, y: 130 } }; }
    return { A, B, C, right: null };
  }
  function drawTri(type, labels) {
    const t = triPath(type);
    const { A, B, C, right } = t;
    let s = `<polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="${K.soft}" stroke="${K.ink}" stroke-width="2.5"/>`;
    if (right) {
      const sz = 16;
      s += `<path d="M ${right.x} ${right.y - sz} L ${right.x + sz} ${right.y - sz} L ${right.x + sz} ${right.y}" fill="none" stroke="${K.warn}" stroke-width="1.5"/>`;
    }
    if (type === "iso") {
      // 两腰刻度
      s += `<line x1="${(A.x + C.x) / 2 - 4}" y1="${(A.y + C.y) / 2 - 7}" x2="${(A.x + C.x) / 2 + 4}" y2="${(A.y + C.y) / 2 - 7}" stroke="${K.ok}" stroke-width="2"/>`;
      s += `<line x1="${(B.x + C.x) / 2 + 4}" y1="${(B.y + C.y) / 2 - 7}" x2="${(B.x + C.x) / 2 - 4}" y2="${(B.y + C.y) / 2 - 7}" stroke="${K.ok}" stroke-width="2"/>`;
    }

    s += `<text x="${A.x - 10}" y="${A.y + 4}" font-size="13" fill="${K.pri}" font-weight="700" font-family="inherit">A</text>`;
    s += `<text x="${B.x + 8}" y="${B.y + 4}" font-size="13" fill="${K.pri}" font-weight="700" font-family="inherit">B</text>`;
    s += `<text x="${C.x}" y="${C.y - 8}" font-size="13" fill="${K.pri}" font-weight="700" font-family="inherit">C</text>`;
    if (labels) {
      s += `<text x="${(A.x + B.x) / 2}" y="${(A.y + B.y) / 2 + 18}" font-size="12" fill="${K.ink}" font-family="inherit">${labels.base || ""}</text>`;
      s += `<text x="${(A.x + C.x) / 2 - 8}" y="${(A.y + C.y) / 2}" font-size="12" fill="${K.ink}" font-family="inherit">${labels.l || ""}</text>`;
      s += `<text x="${(B.x + C.x) / 2 + 8}" y="${(B.y + C.y) / 2}" font-size="12" fill="${K.ink}" font-family="inherit">${labels.r || ""}</text>`;
    }
    return s;
  }
  Fig.tri = function () { return S(320, 160, drawTri("acute"), 320); };
  Fig.triSide = function () { return S(320, 160, drawTri("acute", { base: "4", l: "3", r: "5" }), 320); };
  Fig.triIso = function () { return S(320, 160, drawTri("iso", { base: "腰" }), 320); };
  Fig.triRight = function () { return S(320, 160, drawTri("right", { base: "直角边", l: "直角边" }), 320); };

  /* ---------------- 全等 / 相似 两三角形 ---------------- */
  function twoTri(mode) {
    function tri(cx, cy, sc, fillc, labels, lblc) {
      labels = labels || ["A", "B", "C"];
      lblc = lblc || K.pri;
      const A = { x: cx, y: cy }, B = { x: cx + 70 * sc, y: cy }, C = { x: cx + 30 * sc, y: cy - 60 * sc };
      let s = `<polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="${fillc}" stroke="${K.ink}" stroke-width="2.5"/>`;
      const pts = [A, B, C];
      const off = [{ x: -8, y: 4 }, { x: 6, y: 4 }, { x: 0, y: -6 }];
      labels.forEach((lab, i) => {
        s += `<text x="${pts[i].x + off[i].x}" y="${pts[i].y + off[i].y}" font-size="12" fill="${lblc}" font-weight="700" font-family="inherit">${lab}</text>`;
      });
      // 对应边刻度
      const tick = (p, q, offv) => {
        const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
        const dx = (q.x - p.x), dy = (q.y - p.y), len = Math.hypot(dx, dy);
        const nx = -dy / len * offv, ny = dx / len * offv;
        s += `<line x1="${mx - 5}" y1="${my - 5}" x2="${mx + 5}" y2="${my + 5}" stroke="${K.ok}" stroke-width="2"/>`;
      };
      tick(A, B, 6); tick(B, C, 6); tick(C, A, 6);
      return s;
    }
    let s = tri(40, 120, 1, K.soft, ["A", "B", "C"], K.pri);
    const r = mode === "similar" ? 0.66 : 1;
    s += tri(200, 135, r, "#e7f6ee", ["D", "E", "F"], K.purple);
    if (mode === "similar") {
      s += `<text x="160" y="40" font-size="12" fill="${K.ink}" text-anchor="middle" font-family="inherit">相似：对应边成比例</text>`;
    } else {
      s += `<text x="160" y="40" font-size="12" fill="${K.ink}" text-anchor="middle" font-family="inherit">全等：△ABC ≌ △DEF</text>`;
    }
    return S(320, 160, s, 320);
  }
  Fig.twoTriCong = function () { return twoTri("cong"); };
  Fig.twoTriSim = function () { return twoTri("sim"); };

  /* ---------------- 直角三角形（勾股） ---------------- */
  Fig.rightTri = function (p) {

    s += `<text x="${(A.x + C.x) / 2 - 8}" y="${(A.y + C.y) / 2}" font-size="13" fill="${K.ink}" font-family="inherit">a=${a}</text>`;
    s += `<text x="${(A.x + B.x) / 2}" y="${(A.y + B.y) / 2 + 18}" font-size="13" fill="${K.ink}" font-family="inherit">b=${b}</text>`;
    s += `<text x="${(B.x + C.x) / 2 + 10}" y="${(B.y + C.y) / 2}" font-size="13" fill="${K.red}" font-weight="700" font-family="inherit">c=${c}</text>`;

  Fig.chord = function () {

  /* ---------------- 坐标系 ---------------- */
  function axes(w, h, x0, y0) {
    return `<line x1="30" y1="${y0}" x2="${w - 14}" y2="${y0}" stroke="${K.ink}" stroke-width="1.5"/>` +
      `<path d="M ${w - 22} ${y0} L ${w - 14} ${y0 - 5} L ${w - 14} ${y0 + 5} Z" fill="${K.ink}"/>` +
      `<line x1="${x0}" y1="${h - 20}" x2="${x0}" y2="16" stroke="${K.ink}" stroke-width="1.5"/>` +
      `<path d="M ${x0} 16 L ${x0 - 5} 24 L ${x0 + 5} 24 Z" fill="${K.ink}"/>`;
  }
  Fig.axis = function (p) {
    p = p || {};
    const w = 320, h = 180, x0 = 60, y0 = 140;
    let s = axes(w, h, x0, y0);
    s += `<text x="${w - 16}" y="${y0 - 8}" font-size="11" fill="${K.sub}" font-family="inherit">x</text>`;
    s += `<text x="${x0 + 8}" y="22" font-size="11" fill="${K.sub}" font-family="inherit">y</text>`;
    (p.points || []).forEach(pt => {
      const x = x0 + pt.x * 26, y = y0 - pt.y * 26;
      s += `<circle cx="${x}" cy="${y}" r="5" fill="${pt.color || K.pri}"/>`;
      if (pt.label) s += `<text x="${x + 8}" y="${y - 4}" font-size="11" fill="${K.ink}" font-family="inherit">${pt.label}</text>`;
    });
    if (p.line) {
      const a = { x: x0 + p.line.x1 * 26, y: y0 - p.line.y1 * 26 };
      const b = { x: x0 + p.line.x2 * 26, y: y0 - p.line.y2 * 26 };

    }
    return S(w, h, s, 320);
  };
  Fig.graphLine = function (p) {
    p = p || {};
    const m = p.m != null ? p.m : 1, b = p.b != null ? p.b : -1;
    const w = 320, h = 180, x0 = 60, y0 = 140, sc = 26;
    let s = axes(w, h, x0, y0);
    const f = x => m * x + b;
    let path = "";
    for (let x = -2; x <= 6; x += 0.2) {
      const px = x0 + x * sc, py = y0 - f(x) * sc;
      if (py < 10 || py > h - 24) continue;
      path += (path ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);
    }
    s += `<path d="${path}" fill="none" stroke="${K.red}" stroke-width="2.5"/>`;
    s += `<text x="${w - 70}" y="30" font-size="12" fill="${K.red}" font-family="inherit">y = ${m}x ${b >= 0 ? "+" : ""}${b}</text>`;
    return S(w, h, s, 320);
  };
  Fig.parab = function (p) {
    p = p || {};
    const a = p.a != null ? p.a : 1;
    const w = 320, h = 180, x0 = 160, y0 = 150, sc = 18;
    let s = axes(w, h, x0, y0);
    let path = "";
    for (let x = -4; x <= 4; x += 0.15) {
      const px = x0 + x * sc, py = y0 - a * x * x * sc * 0.5;

      path += (path ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);

    let s = axes(w, h, x0, y0);
    let path1 = "", path2 = "";
    for (let x = 0.4; x <= 5; x += 0.15) {
      const px = x0 + x * sc, py = y0 - (k / x) * sc * 0.4;
      const px2 = x0 - x * sc, py2 = y0 + (k / x) * sc * 0.4;

      [cx - s, cy - s], [cx + s, cy - s], [cx + s, cy + s], [cx - s, cy + s]

  /* ---------------- 圆锥曲线 ---------------- */
  Fig.conicFig = function (p) {
    p = p || {};
    const type = p.type || "ellipse";
    const cx = 160, cy = 90, w = 320, h = 180;
    let s = axes(w, h, 40, cy);
    if (type === "hyperbola") {
      let p1 = "", p2 = "";
      for (let t = -3; t <= 3; t += 0.1) {
        const x = 160 + 70 * Math.cosh(t), y = 90 - 45 * Math.sinh(t);
        const x2 = 160 - 70 * Math.cosh(t), y2 = 90 + 45 * Math.sinh(t);
        p1 += (p1 ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
        p2 += (p2 ? " L " : "M ") + x2.toFixed(1) + " " + y2.toFixed(1);
      }
      s += `<path d="${p1}" fill="none" stroke="${K.red}" stroke-width="2.5"/>`;
      s += `<path d="${p2}" fill="none" stroke="${K.red}" stroke-width="2.5"/>`;
    } else if (type === "parabola") {
      let pp = "";
      for (let x = -4; x <= 4; x += 0.15) {
        const px = 160 + x * 22, py = 90 - x * x * 4;
        if (py < 14) continue;
        pp += (pp ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);
      }
      s += `<path d="${pp}" fill="none" stroke="${K.red}" stroke-width="2.5"/>`;
    } else {

  Fig.euler_circle = function () {
    const cx = 150, cy = 150, R = 110;
    let s = `<line x1="20" y1="${cy}" x2="280" y2="${cy}" stroke="${K.ink}" stroke-width="1.5"/>`;
    s += `<line x1="${cx}" y1="20" x2="${cx}" y2="280" stroke="${K.ink}" stroke-width="1.5"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${K.pri}" stroke-width="2"/>`;
    const ang = Math.PI / 3;
    const x = cx + R * Math.cos(ang), y = cy - R * Math.sin(ang);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${K.warn}" stroke-width="3"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${cy}" stroke="${K.red}" stroke-width="2" stroke-dasharray="4 3"/>`;
    s += `<line x1="${x}" y1="${cy}" x2="${x}" y2="${y}" stroke="${K.green}" stroke-width="2" stroke-dasharray="4 3"/>`;
    s += `<circle cx="${x}" cy="${y}" r="5" fill="${K.warn}"/>`;
    s += `<text x="${x + 8}" y="${y - 8}" fill="${K.ink}" font-size="13">e^(iθ)</text>`;
    s += `<text x="${cx + R / 2 - 10}" y="${cy + 20}" fill="${K.red}" font-size="12">cosθ</text>`;
    s += `<text x="${x + 8}" y="${cy - 4}" fill="${K.green}" font-size="12">sinθ</text>`;
    s += `<text x="24" y="22" fill="${K.sub}" font-size="12">欧拉公式 e^(iθ)=cosθ+i·sinθ</text>`;
    return S(300, 300, s);
  };

  Fig.taylor_graph = function () {
    const W = 320, H = 220, cx = 40, cy = 180;
    const X = v => cx + v * 28;
    const Y = v => { let w = v; if (w > 9) w = 9; return cy - w * 16; };
    let s = `<line x1="${cx}" y1="10" x2="${cx}" y2="${cy}" stroke="${K.ink}" stroke-width="1.5"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="312" y2="${cy}" stroke="${K.ink}" stroke-width="1.5"/>`;
    function curve(fn, color, w) {
      let pts = [];
      for (let i = -1; i <= 2.8001; i += 0.1) { let v = fn(i); if (v > 9) v = 9; pts.push([X(i), Y(v)]); }
      s += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" fill="none" stroke="${color}" stroke-width="${w}"/>`;
    }
    curve(Math.exp, K.pri, 2.5);
    curve(x => 1 + x + x * x / 2 + x * x * x / 6, K.warn, 2.5);
    s += `<text x="20" y="22" fill="${K.sub}" font-size="12">蓝：e^x　橙：1+x+x²/2+x³/6</text>`;
    return S(W, H, s);
  };
