  <script>
/* ============================================================
 * 融会贯通 · 参数化出题引擎（小学核心 10 法）
 *  - 每个技巧注册 qgen(n)：每次生成 n 道全新随机题，真正不重样
 *  - 生成的题自带 q.fig，由 app.js 的 renderFigOf() 渲染配图
 *  - 学而思 / 作业帮 / 高途 通用套路：假设法、画图法、归一、找周期……
 * ============================================================ */
(function () {
  /* ---------- 通用工具 ---------- */
  const K = { ink: "#334155", sub: "#64748b", line: "#cbd5e1", pri: "#2f6fed", ok: "#16a34a", warn: "#d97706", red: "#dc2626", soft: "#eef3ff", blue: "#2563eb", purple: "#7c3aed" };
  function S(w, h, inner, maxw) {
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${maxw || w}px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // 由正确答构造 n 个互异选项（含正确项）；make() 生成干扰项
  function opts(ans, make, n) {
    n = n || 4;
    const set = new Set([ans]);
    let g = 0;
    while (set.size < n && g++ < 400) { const d = make(); if (d !== ans) set.add(d); }
    let k = 1;
    while (set.size < n) { set.add(ans + k); if (set.size < n) set.add(ans - k); k++; }
    const arr = shuffle([...set]).map(String);
    return { opts: arr, ans: arr.indexOf(String(ans)) };
  }

  function Q(q, optsObj, level, explain, point, fig) {
    return Object.assign({ q, level: level || "基础", explain, point: point || "" }, optsObj, { fig: fig || null });
  }

  /* ============================================================
   * 1. 鸡兔同笼（假设法 / 抬脚法）
   * ============================================================ */
  function qChicken() {
    const H = rnd(8, 18);
    const R = rnd(2, Math.max(3, H - 2));
    const C = H - R;
    const F = 2 * C + 4 * R;
    const askRabbit = Math.random() < 0.5;
    const ans = askRabbit ? R : C;
    const o = opts(ans, () => rnd(1, H - 1));
    const q = `鸡兔同笼：共有 ${H} 个头，${F} 只脚。问${askRabbit ? "兔" : "鸡"}有几只？`;
    const explain = askRabbit
      ? `假设全是鸡，应有 ${2 * H} 只脚，实际多 ${F - 2 * H} 只；每只兔比鸡多 2 脚，兔 = (${F} − ${2 * H}) ÷ 2 = ${R} 只。`
      : `假设全是兔，应有 ${4 * H} 只脚，实际少 ${4 * H - F} 只；每只鸡比兔少 2 脚，鸡 = (${4 * H} − ${F}) ÷ 2 = ${C} 只。`;
    return Q(q, o, "基础", explain, "假设法/抬脚法", { name: "gChicken", H, F, C, R });
  }

  /* ============================================================
   * 2. 植树问题（两端都栽 / 只栽一端 / 两端不栽 / 环形）
   * ============================================================ */
  function qPlant() {
    const d = pick([2, 4, 5, 10]);
    const seg = rnd(4, 12);
    const L = d * seg;
    const type = rnd(0, 3);
    const base = seg;
    let trees, mode, q, figMode, exp;
    if (type === 0) { trees = base + 1; mode = "both"; figMode = "both"; q = `一条 ${L} 米长的路，每隔 ${d} 米栽一棵（两端都栽），共需多少棵树？`; exp = `间隔数 = ${L} ÷ ${d} = ${base}；两端都栽：棵数 = 间隔数 + 1 = ${base + 1}。`; }
    else if (type === 1) { trees = base; mode = "one"; figMode = "one"; q = `一条 ${L} 米长的路，每隔 ${d} 米栽一棵（只栽一端），共需多少棵树？`; exp = `间隔数 = ${L} ÷ ${d} = ${base}；只栽一端：棵数 = 间隔数 = ${base}。`; }
    else if (type === 2) { trees = base - 1; mode = "none"; figMode = "none"; q = `一条 ${L} 米长的路，每隔 ${d} 米栽一棵（两端都不栽），共需多少棵树？`; exp = `间隔数 = ${L} ÷ ${d} = ${base}；两端不栽：棵数 = 间隔数 − 1 = ${base - 1}。`; }
    else { trees = base; mode = "ring"; figMode = "ring"; q = `一个周长 ${L} 米的圆形花坛，沿边每隔 ${d} 米栽一棵，共需多少棵树？`; exp = `封闭图形：棵数 = 间隔数 = ${L} ÷ ${d} = ${base}。`; }
    const o = opts(trees, () => Math.max(1, base + rnd(-2, 3)));
    return Q(q, o, "基础", exp, "植树三情形", { name: "gPlant", seg, mode: figMode });
  }

  /* ============================================================
   * 3. 和差倍问题（和差 / 和倍 / 差倍）
   * ============================================================ */
  function qSumDiff() {
    const type = rnd(0, 2);
    if (type === 0) {
      const D = rnd(4, 30); const big = rnd(D + 2, D + 30); const small = big - D; const Ssum = big + small;
      const askBig = Math.random() < 0.5; const ans = askBig ? big : small;
      const o = opts(ans, () => rnd(small - 5, big + 5));
      const q = `两数之和是 ${Ssum}，差是 ${D}。问${askBig ? "较大的数" : "较小的数"}是多少？`;
      const exp = `较大 = (和 + 差) ÷ 2 = (${Ssum} + ${D}) ÷ 2 = ${big}；较小 = (和 − 差) ÷ 2 = (${Ssum} − ${D}) ÷ 2 = ${small}。`;
      return Q(q, o, "基础", exp, "和差公式", { name: "gSumdiff", big, small, type: "sd" });
    } else if (type === 1) {
      const m = rnd(2, 4); const small = rnd(3, 15); const big = small * m; const Ssum = big + small;
      const askBig = Math.random() < 0.5; const ans = askBig ? big : small;
      const o = opts(ans, () => rnd(2, big + 5));
      const q = `两数之和是 ${Ssum}，大数是小数的 ${m} 倍。问${askBig ? "大数" : "小数"}是多少？`;
      const exp = `小数 = 和 ÷ (倍数 + 1) = ${Ssum} ÷ (${m} + 1) = ${small}；大数 = ${small} × ${m} = ${big}。`;
      return Q(q, o, "基础", exp, "和倍公式", { name: "gSumdiff", big, small, type: "sb" });
    } else {
      const m = rnd(2, 4); const small = rnd(2, 12); const big = small * m; const D = big - small;
      const askBig = Math.random() < 0.5; const ans = askBig ? big : small;
      const o = opts(ans, () => rnd(1, big + 5));
      const q = `两数之差是 ${D}，大数是小数的 ${m} 倍。问${askBig ? "大数" : "小数"}是多少？`;
      const exp = `小数 = 差 ÷ (倍数 − 1) = ${D} ÷ (${m} − 1) = ${small}；大数 = ${small} × ${m} = ${big}。`;
      return Q(q, o, "基础", exp, "差倍公式", { name: "gSumdiff", big, small, type: "db" });
    }
  }

  /* ============================================================
   * 4. 盈亏问题（一盈一亏 / 双盈 / 双亏）
   * ============================================================ */
  function qProfit() {
    const type = rnd(0, 2);
    const a = rnd(3, 6), c = a + rnd(1, 3);
    const N = rnd(3, 10);
    let q, ans, exp, fig, o;
    if (type === 0) {
      const diff = (c - a) * N;
      const b = rnd(1, diff - 1), dd = diff - b;
      ans = N; const thing = a * N + b;
      o = opts(ans, () => rnd(2, N + 8));
      q = `分糖果：如果每人分 ${a} 颗，多出 ${b} 颗；如果每人分 ${c} 颗，反而少 ${dd} 颗。一共有几个小朋友？`;
      exp = `人数 = (盈 + 亏) ÷ 两次每份差 = (${b} + ${dd}) ÷ (${c} − ${a}) = ${diff} ÷ ${c - a} = ${N} 人。（糖果共 ${thing} 颗）`;
      fig = { name: "gProfit", a, c, b, d: dd, N, thing };
    } else if (type === 1) {
      const diff = (c - a) * N;
      const b = rnd(diff + 1, diff + 12); const e = b - diff;
      ans = N; const thing = a * N + b;
      o = opts(ans, () => rnd(2, N + 8));
      q = `分糖果：每人分 ${a} 颗多 ${b} 颗；每人分 ${c} 颗多 ${e} 颗。一共有几个小朋友？`;
      exp = `人数 = (大盈 − 小盈) ÷ 两次每份差 = (${b} − ${e}) ÷ (${c} − ${a}) = ${diff} ÷ ${c - a} = ${N} 人。`;
      fig = { name: "gProfit", a, c, b, e, N, thing, kind: "双盈" };
    } else {
      const diff = (c - a) * N;
      const f = rnd(diff + 1, diff + 12); const g = f - diff;
      ans = N; const need = a * N + f;
      o = opts(ans, () => rnd(2, N + 8));
      q = `分糖果：每人分 ${a} 颗少 ${f} 颗；每人分 ${c} 颗少 ${g} 颗。一共有几个小朋友？`;
      exp = `人数 = (大亏 − 小亏) ÷ 两次每份差 = (${f} − ${g}) ÷ (${c} − ${a}) = ${diff} ÷ ${c - a} = ${N} 人。`;
      fig = { name: "gProfit", a, c, f, g, N, thing: need, kind: "双亏" };
    }
    return Q(q, o, "进阶", exp, "盈亏公式", fig);
  }

  /* ============================================================
   * 5. 平均数问题（求平均 / 已知平均求缺数）
   * ============================================================ */
  function qAvg() {
    const type = rnd(0, 1);
    if (type === 0) {
      const n = rnd(3, 5);
      const vals = []; let sum = 0;
      for (let i = 0; i < n; i++) { const v = rnd(60, 98); vals.push(v); sum += v; }
      const r = sum % n; if (r !== 0) { vals[n - 1] += (n - r); sum += (n - r); }
      const avg = sum / n;
      const o = opts(avg, () => rnd(50, 99));
      const q = `某小组 ${n} 次测验成绩分别为 ${vals.join("、")} 分，平均成绩是多少？`;
      const exp = `总数 = ${sum}，份数 = ${n}，平均数 = ${sum} ÷ ${n} = ${avg} 分。`;
      return Q(q, o, "基础", exp, "总数 ÷ 份数", { name: "gAvg", vals, avg, showAvg: false });
    } else {
      const n = rnd(3, 5);
      const avg = rnd(70, 90);
      const known = [];
      for (let i = 0; i < n - 1; i++) known.push(rnd(Math.max(45, avg - 15), avg));
      const sum = avg * n;
      const knownSum = known.reduce((x, y) => x + y, 0);
      const miss = sum - knownSum;
      const o = opts(miss, () => rnd(40, 120));
      const q = `前 ${n - 1} 次成绩为 ${known.join("、")} 分，要使平均分达到 ${avg} 分，第 ${n} 次至少要考多少分？`;
      const exp = `总分需 ${avg} × ${n} = ${sum}，已得 ${knownSum} 分，缺 = ${sum} − ${knownSum} = ${miss} 分。`;
      return Q(q, o, "进阶", exp, "平均数 × 份数", { name: "gAvg", vals: known.concat([miss]), avg, showAvg: true, missIndex: known.length });
    }
  }

  /* ============================================================
   * 6. 周期问题（找余数定位）
   * ============================================================ */
  function qCycle() {
    const T = rnd(2, 5);
    const letters = "ABCDEF".slice(0, T).split("");
    const n = rnd(T + 3, T + 20);
    const rem = n % T, pos = rem === 0 ? T : rem;
    const ansSym = letters[pos - 1];
    const optList = shuffle(letters.slice());
    const o = { opts: optList, ans: optList.indexOf(ansSym) };
    const q = `一串珠子按 ${letters.join("")} 的顺序不断重复排列。第 ${n} 个珠子是什么？`;
    const exp = `周期长 = ${T}。${n} ÷ ${T} = ${Math.floor(n / T)} …… ${rem === 0 ? T : rem}，余数定位周期里第 ${pos} 个 = ${ansSym}。`;
    return Q(q, o, "基础", exp, "找周期余数", { name: "gCycle", letters, highlight: pos - 1 });
  }

  /* ============================================================
   * 7. 归一问题（先求单一量 / 归总反求）
   * ============================================================ */
  function qGuiyi() {
    const type = rnd(0, 1);
    if (type === 0) {
      const ppl = rnd(2, 5), days = rnd(2, 6);
      const unit = rnd(3, 9);
      const total = unit * ppl * days;
      const p2 = rnd(2, 6), d2 = rnd(2, 6);
      const ans = unit * p2 * d2;
      const o = opts(ans, () => unit * rnd(1, 8) * rnd(1, 7));
      const q = `${ppl} 个工人 ${days} 天可生产零件 ${total} 个。照这样计算，${p2} 个工人 ${d2} 天可生产多少个？`;
      const exp = `单一量 = 总数 ÷ 人数 ÷ 天数 = ${total} ÷ ${ppl} ÷ ${days} = ${unit} 个/人天；${p2} 人 ${d2} 天 = ${unit} × ${p2} × ${d2} = ${ans} 个。`;
      return Q(q, o, "基础", exp, "先求单一量", { name: "gGuiyi", ppl, days, unit, p2, d2, ans });
    } else {
      const ppl = rnd(2, 5), days = rnd(3, 9);
      const total = ppl * days;
      let p2; do { p2 = rnd(2, 7); } while (total % p2 !== 0);
      const ans = total / p2;
      const o = opts(ans, () => Math.max(1, Math.round(total / rnd(1, 7))));
      const q = `一批任务，${ppl} 人做需 ${days} 天完成。若改为 ${p2} 人同时做（效率相同），需多少天？`;
      const exp = `总工作量 = ${ppl} × ${days} = ${total} 人·天；${p2} 人需 ${total} ÷ ${p2} = ${ans} 天。`;
      return Q(q, o, "进阶", exp, "归总（总量不变）", { name: "gGuiyi", ppl, days, p2, ans, total });
    }
  }

  /* ============================================================
   * 8. 工程问题（设总量为 1）
   * ============================================================ */
  const PAIRS = [[6, 3], [3, 6], [4, 4], [12, 4], [4, 12], [6, 6], [8, 8], [9, 6], [6, 9], [12, 6], [6, 12], [10, 15], [15, 10]];
  function qEngineer() {
    const type = rnd(0, 2);
    const pr = pick(PAIRS); const a = pr[0], b = pr[1];
    const coop = Math.round(a * b / (a + b));
    if (type === 0) {
      const o = opts(coop, () => rnd(2, Math.max(coop + 3, a, b)));
      const q = `一项工程，甲单独做需 ${a} 天，乙单独做需 ${b} 天。两人合作需几天完成？`;
      const exp = `甲效 = 1/${a}，乙效 = 1/${b}；合作效 = 1/${a} + 1/${b} = (${a} + ${b})/${a * b}；时间 = 1 ÷ (${(a + b)}/${a * b}) = ${a * b} ÷ (${a + b}) = ${coop} 天。`;
      return Q(q, o, "基础", exp, "工程问题（设总量为1）", { name: "gEngineer", bars: [{ l: "甲", v: a }, { l: "乙", v: b }] });
    } else if (type === 1) {
      const o = opts(b, () => rnd(2, a + 10));
      const q = `一项工程，甲单独做需 ${a} 天，甲乙合作需 ${coop} 天。乙单独做需几天？`;
      const exp = `1/${a} + 1/乙 = 1/${coop} → 1/乙 = 1/${coop} − 1/${a} = (${a} − ${coop})/(${a * coop}) → 乙 = ${a * coop} ÷ (${a} − ${coop}) = ${b} 天。`;
      return Q(q, o, "进阶", exp, "合作效率反求", { name: "gEngineer", bars: [{ l: "甲", v: a }, { l: "合作", v: coop }] });
    } else {
      const save = a - coop;
      const o = opts(save, () => rnd(1, Math.max(save + 3, a)));
      const q = `甲单独做 ${a} 天，两人合作 ${coop} 天。合作比甲单独少用几天？`;
      const exp = `甲单独 ${a} 天，合作 ${coop} 天，少用 ${a} − ${coop} = ${save} 天（效率越高用时越短）。`;
      return Q(q, o, "基础", exp, "效率比较", { name: "gEngineer", bars: [{ l: "甲", v: a }, { l: "合作", v: coop }] });
    }
  }

  /* ============================================================
   * 9. 相遇问题（求时间 / 求路程 / 求一速度）
   * ============================================================ */
  function qMeet() {
    const type = rnd(0, 2);
    const v1 = rnd(40, 90), v2 = rnd(30, 80);
    const vsum = v1 + v2;
    if (type === 0) {
      const t = rnd(2, 6); const s = vsum * t;
      const o = opts(t, () => rnd(1, t + 4));
      const q = `甲、乙从相距 ${s} 千米两地同时相向出发，甲速 ${v1} 千米/时，乙速 ${v2} 千米/时。几小时相遇？`;
      const exp = `相遇时间 = 路程 ÷ 速度和 = ${s} ÷ (${v1} + ${v2}) = ${s} ÷ ${vsum} = ${t} 小时。`;
      return Q(q, o, "基础", exp, "相遇：s=(v1+v2)t", { name: "gMeet", s, v1, v2, t, show: { s: 1, v1: 1, v2: 1, t: 0 } });
    } else if (type === 1) {
      const t = rnd(2, 6); const s = vsum * t;
      const o = opts(s, () => vsum * rnd(1, t + 2));
      const q = `甲速 ${v1} 千米/时、乙速 ${v2} 千米/时，相向而行 ${t} 小时后相遇。两地相距多少千米？`;
      const exp = `路程 = 速度和 × 时间 = (${v1} + ${v2}) × ${t} = ${vsum} × ${t} = ${s} 千米。`;
      return Q(q, o, "基础", exp, "相遇：s=(v1+v2)t", { name: "gMeet", s, v1, v2, t, show: { s: 0, v1: 1, v2: 1, t: 1 } });
    } else {
      const t = rnd(2, 6); const s = vsum * t;
      const o = opts(v2, () => rnd(20, v1 + 40));
      const q = `两地相距 ${s} 千米，相向而行 ${t} 小时相遇；甲速 ${v1} 千米/时，乙速多少？`;
      const exp = `速度和 = ${s} ÷ ${t} = ${vsum}；乙速 = 速度和 − 甲速 = ${vsum} − ${v1} = ${v2} 千米/时。`;
      return Q(q, o, "进阶", exp, "相遇：求速度和", { name: "gMeet", s, v1, v2, t, show: { s: 1, v1: 1, v2: 0, t: 1 } });
    }
  }

  /* ============================================================
   * 10. 追及问题（求时间 / 求路程差 / 求一速度）
   * ============================================================ */
  function qChase() {
    const type = rnd(0, 2);
    const v2 = rnd(30, 70), dv = rnd(5, 30), v1 = v2 + dv;
    if (type === 0) {
      const t = rnd(2, 6); const ds = dv * t;
      const o = opts(t, () => rnd(1, t + 4));
      const q = `甲速 ${v1} 千米/时，乙速 ${v2} 千米/时，乙先走 ${ds} 千米后甲同向追乙。几小时追上？`;
      const exp = `追及时间 = 路程差 ÷ 速度差 = ${ds} ÷ (${v1} − ${v2}) = ${ds} ÷ ${dv} = ${t} 小时。`;
      return Q(q, o, "基础", exp, "追及：t=Δs÷(v1−v2)", { name: "gChase", v1, v2, ds, t, show: { v1: 1, v2: 1, ds: 1, t: 0 } });
    } else if (type === 1) {
      const t = rnd(2, 6); const ds = dv * t;
      const o = opts(ds, () => dv * rnd(1, t + 3));
      const q = `甲速 ${v1} 千米/时、乙速 ${v2} 千米/时，同向而行，${t} 小时后甲追上乙。乙先走了多少千米？`;
      const exp = `路程差 = 速度差 × 时间 = (${v1} − ${v2}) × ${t} = ${dv} × ${t} = ${ds} 千米。`;
      return Q(q, o, "基础", exp, "追及：Δs=(v1−v2)t", { name: "gChase", v1, v2, ds, t, show: { v1: 1, v2: 1, ds: 0, t: 1 } });
    } else {
      const t = rnd(2, 6); const ds = dv * t;
      const o = opts(v2, () => rnd(20, v1 + 10));
      const q = `甲速 ${v1} 千米/时，乙先走 ${ds} 千米，${t} 小时后甲追上乙。乙速多少？`;
      const exp = `速度差 = 路程差 ÷ 时间 = ${ds} ÷ ${t} = ${dv}；乙速 = 甲速 − 速度差 = ${v1} − ${dv} = ${v2} 千米/时。`;
      return Q(q, o, "进阶", exp, "追及：求速度差", { name: "gChase", v1, v2, ds, t, show: { v1: 1, v2: 0, ds: 1, t: 1 } });
    }
  }

  /* ============================================================
   * 配图：生成题自带 fig，由 renderFigOf() 调用 window.Fig[name]

  // 顶部括号标注（用于线段图），只标"题目已给出的量"，绝不标答案
  function bracket(x1, x2, y, label) {

           `<line x1="${x2}" y1="${y}" x2="${x2}" y2="${y - t}" stroke="${K.sub}" stroke-width="1.2"/>` +

    s += `<text x="248" y="64" font-size="13" text-anchor="middle" fill="${K.pri}">头 ${p.H}</text>`;
    s += `<text x="248" y="86" font-size="13" text-anchor="middle" fill="${K.pri}">脚 ${p.F}</text>`;
    s += `<text x="248" y="104" font-size="10" text-anchor="middle" fill="${K.sub}">（仅示意）</text>`;
    return S(320, 128, s, 320);
  };
  window.Fig.gPlant = function (p) {
    p = p || {}; const seg = p.seg || 5, mode = p.mode || "both";
    if (mode === "ring") {
      const cx = 160, cy = 64, R = 52;
      let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${K.sub}" stroke-width="2"/>`;
      for (let i = 0; i < seg; i++) { const ang = -Math.PI / 2 + i * 2 * Math.PI / seg; const x = cx + R * Math.cos(ang), y = cy + R * Math.sin(ang); s += `<line x1="${x}" y1="${y}" x2="${cx + (R - 12) * Math.cos(ang)}" y2="${cy + (R - 12) * Math.sin(ang)}" stroke="${K.pri}" stroke-width="2"/>`; }
      s += `<text x="160" y="140" font-size="12" text-anchor="middle" fill="${K.ink}">周长分 ${seg} 段（间隔）</text>`;
      return S(320, 152, s, 320);
    }
    const x0 = 20, x1 = 300, y = 70, gap = (x1 - x0) / seg;
    let s = `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${K.sub}" stroke-width="2"/>`;
    for (let i = 0; i <= seg; i++) { const x = x0 + i * gap; s += `<line x1="${x}" y1="${y - 9}" x2="${x}" y2="${y + 9}" stroke="${K.pri}" stroke-width="2"/>`; }
    const label = { both: "两端都栽：棵数 = 间隔 + 1", one: "只栽一端：棵数 = 间隔", none: "两端不栽：棵数 = 间隔 − 1" }[mode] || mode;
    s += `<text x="160" y="112" font-size="12" text-anchor="middle" fill="${K.ink}">共 ${seg} 段间隔</text>`;
    s += `<text x="160" y="134" font-size="11" text-anchor="middle" fill="${K.sub}">${label}</text>`;
    return S(320, 148, s, 320);
  };
  // 线段图：只标"和/差/倍数"（题目已给），绝不标出大数、小数
  window.Fig.gSumdiff = function (p) {
    p = p || {}; const big = p.big || 9, small = p.small || 5, type = p.type || "sd";
    const unit = 4, x0 = 30, barH = 34, ySmall = 64, yBig = 118;
    const wSmall = small * unit, wBig = big * unit, sum = big + small;
    let s = "";
    if (type === "sb" || type === "db") {
      const m = big / small;
      s += `<rect x="${x0}" y="${ySmall}" width="${wSmall}" height="${barH}" fill="${K.pri}" opacity="0.85"/>`;
      s += `<text x="${x0 + wSmall / 2}" y="${ySmall + 22}" font-size="12" text-anchor="middle" fill="#fff">小数</text>`;

      for (let i = 1; i < m; i++) { const x = x0 + i * wSmall; s += `<line x1="${x}" y1="${yBig}" x2="${x}" y2="${yBig + barH}" stroke="#fff" stroke-width="1.5"/>`; }
      s += bracket(x0, x0 + wBig, ySmall - 14, `和 = ${sum}`);
      if (type === "db") { const dW = (m - 1) * wSmall; s += `<rect x="${x0 + wSmall}" y="${yBig}" width="${dW}" height="${barH}" fill="none" stroke="${K.warn}" stroke-width="2" stroke-dasharray="4 3"/><text x="${x0 + wSmall + dW / 2}" y="${yBig + barH + 18}" font-size="11" text-anchor="middle" fill="${K.warn}">差 = ${big - small}</text>`; }

    }
    const D = big - small;
    s += `<rect x="${x0}" y="${ySmall}" width="${wSmall}" height="${barH}" fill="${K.pri}" opacity="0.85"/>`;

  };
  // 盈亏：只列两种分法（题目已给），人数由学生用公式算
  window.Fig.gProfit = function (p) {

  // 平均数：只画已知分数；答案(平均)仅在题目已给时才画线
  window.Fig.gAvg = function (p) {

    const n = vals.length, max = Math.max.apply(null, vals.concat(showAvg ? [avg] : [])), H = 90, yb = 120, uw = Math.min(40, 240 / n), gap = 14;
    let s = ""; const totalW = n * (uw + gap), x0 = (320 - totalW) / 2;
    vals.forEach((v, i) => { const x = x0 + i * (uw + gap), h = v / max * H; const miss = (p.missIndex != null && i === p.missIndex); s += `<rect x="${x}" y="${yb - h}" width="${uw}" height="${h}" fill="${miss ? K.line : K.pri}"/><text x="${x + uw / 2}" y="${yb - h - 5}" font-size="11" text-anchor="middle" fill="${K.ink}">${miss ? "?" : v}</text>`; });
    if (showAvg && avg != null) { const avgY = yb - avg / max * H; s += `<line x1="${x0 - 6}" y1="${avgY}" x2="${x0 + totalW + 6}" y2="${avgY}" stroke="${K.warn}" stroke-width="2" stroke-dasharray="5 3"/><text x="${x0 + totalW + 10}" y="${avgY + 4}" font-size="11" fill="${K.warn}">平均${avg}</text>`; }
    return S(320, 140, s, 320);
  };
  // 周期：只展示循环规律，不标答案位置
  window.Fig.gCycle = function (p) {
    p = p || {}; const letters = p.letters || ["A", "B", "C"];
    const n = letters.length, gap = Math.min(48, 260 / n), x0 = (320 - n * gap) / 2 + gap / 2;
    let s = "";
    letters.forEach((L, i) => { const x = x0 + i * gap; s += `<circle cx="${x}" cy="56" r="18" fill="${K.soft}" stroke="${K.ink}" stroke-width="1.5"/><text x="${x}" y="61" font-size="14" text-anchor="middle" fill="${K.ink}">${L}</text>`; if (i < n - 1) s += `<text x="${x + gap / 2}" y="61" font-size="14" fill="${K.sub}">→</text>`; });
    s += `<text x="160" y="104" font-size="12" text-anchor="middle" fill="${K.ink}">周期 ${n}：按此顺序不断重复</text>`;
    s += `<text x="160" y="124" font-size="11" text-anchor="middle" fill="${K.sub}">第 ${p.n} 个 = ?（用余数定位）</text>`;
    return S(320, 138, s, 320);
  };
  // 归一：只画"人数×天数"网格（题目已给），不标单一量
  window.Fig.gGuiyi = function (p) {
    p = p || {}; const ppl = p.ppl || 3, days = p.days || 4, total = p.total;
    const cols = ppl, rows = Math.min(days, 8), cw = 26, ch = 20, x0 = 30, y0 = 30;
    let s = "";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) s += `<rect x="${x0 + c * cw}" y="${y0 + r * ch}" width="${cw - 3}" height="${ch - 3}" fill="${K.soft}" stroke="${K.line}" stroke-width="1"/>`;
    s += `<text x="30" y="${y0 + rows * ch + 18}" font-size="12" fill="${K.ink}">${ppl} 人 × ${days} 天 = ${ppl * days} 人·天</text>`;
    if (total != null) s += `<text x="30" y="${y0 + rows * ch + 36}" font-size="12" fill="${K.pri}">共生产 ${total} 个</text>`;
    return S(320, y0 + rows * ch + 46, s, 320);
  };
  // 工程：只画"题目已给"的效率条，绝不含答案条
  window.Fig.gEngineer = function (p) {
    p = p || {}; const bars = p.bars || [{ l: "甲", v: 6 }, { l: "乙", v: 3 }];
    const max = Math.max.apply(null, bars.map(b => b.v).concat([1])), H = 90, yb = 120, uw = 26, gap = 72, x0 = 44;
    let s = "";
    bars.forEach((b, i) => { const x = x0 + i * gap, h = b.v / max * H; s += `<rect x="${x}" y="${yb - h}" width="${uw}" height="${h}" fill="${i === 0 ? K.pri : K.ok}"/><text x="${x + uw / 2}" y="${yb - h - 6}" font-size="12" text-anchor="middle" fill="${K.ink}">${b.l}${b.v}</text>`; });

  // 相遇：只标"题目已给"的量，答案(时间/路程/速度)不出现
  window.Fig.gMeet = function (p) {
    p = p || {}; const show = p.show || {}, s = p.s, v1 = p.v1, v2 = p.v2, t = p.t;

    if (show.v1) svg += `<circle cx="40" cy="70" r="8" fill="${K.pri}"/><text x="40" y="94" font-size="11" text-anchor="middle" fill="${K.pri}">甲${v1}</text>`; else svg += `<circle cx="40" cy="70" r="8" fill="${K.pri}"/>`;
    if (show.v2) svg += `<circle cx="280" cy="70" r="8" fill="${K.ok}"/><text x="280" y="94" font-size="11" text-anchor="middle" fill="${K.ok}">乙${v2}</text>`; else svg += `<circle cx="280" cy="70" r="8" fill="${K.ok}"/>`;
    if (show.s) svg += `<text x="160" y="116" font-size="12" text-anchor="middle" fill="${K.ink}">相距 ${s} 千米</text>`;
    if (show.t) svg += `<text x="160" y="58" font-size="12" text-anchor="middle" fill="${K.warn}">行 ${t} 小时</text>`;
    svg += `<text x="160" y="50" font-size="11" text-anchor="middle" fill="${K.sub}">相向而行</text>`;
    return S(320, 132, svg, 320);
  };
  // 追及：只标"题目已给"的量
  window.Fig.gChase = function (p) {
    p = p || {}; const show = p.show || {}, v1 = p.v1, v2 = p.v2, ds = p.ds, t = p.t;
    let svg = `<line x1="30" y1="70" x2="290" y2="70" stroke="${K.sub}" stroke-width="2"/>`;
    if (show.v2) svg += `<circle cx="120" cy="70" r="8" fill="${K.ok}"/><text x="120" y="94" font-size="11" text-anchor="middle" fill="${K.ok}">乙${v2}</text>`; else svg += `<circle cx="120" cy="70" r="8" fill="${K.ok}"/>`;
    if (show.v1) svg += `<circle cx="40" cy="70" r="8" fill="${K.pri}"/><text x="40" y="50" font-size="11" text-anchor="middle" fill="${K.pri}">甲${v1}</text>`; else svg += `<circle cx="40" cy="70" r="8" fill="${K.pri}"/>`;
    if (show.ds) svg += `<text x="205" y="116" font-size="12" text-anchor="middle" fill="${K.ink}">乙先走 ${ds} 千米</text>`;
    if (show.t) svg += `<text x="200" y="58" font-size="12" fill="${K.warn}">追及 ${t} 小时</text>`;
    svg += `<text x="160" y="50" font-size="11" text-anchor="middle" fill="${K.sub}">同向而行</text>`;
    return S(320, 132, svg, 320);
  };

  /* ============================================================
   * 注册：把 qgen 挂到对应技巧上（引擎见 app.js renderQuiz）
   * ============================================================ */
  const GEN = { chicken: qChicken, plant: qPlant, sumdiff: qSumDiff, profitloss: qProfit, average: qAvg, cycle: qCycle, guiyi: qGuiyi, engineer: qEngineer, meet: qMeet, chase: qChase };
  if (window.TECHNIQUES) {
    window.TECHNIQUES.forEach(t => {
      if (GEN[t.id]) {
        // qgen(n)：每次随机生成 n 道全新题，真正不重样
        t.qgen = function (n) { const out = []; for (let i = 0; i < (n || 6); i++) out.push(GEN[t.id]()); return out; };
      }

  window.QGEN_READY = true;
})();

  <script>
/* ============================================================
 * 融会贯通 · 初中数学方法参数化出题引擎
 * 覆盖：有理数、整式、一元一次方程、不等式、方程组、
 *       线段角、三角形、全等三角形、相似三角形、勾股定理、
 *       四边形、圆、一次函数、反比例函数、二次函数
 * ============================================================ */
(function () {
  const K = { ink: "#334155", sub: "#64748b", line: "#cbd5e1", pri: "#2f6fed", ok: "#16a34a", warn: "#d97706", red: "#dc2626", soft: "#eef3ff", blue: "#2563eb" };
  function S(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // opts(ans, make1, make2, make3) - 由正确答和3个干扰项生成4个互异选项
  function opts(ans, make1, make2, make3) {
    const arr = [String(ans), String(make1()), String(make2()), String(make3())];
    const unique = [...new Set(arr)];
    while (unique.length < 4) { unique.push(String(ans + unique.length)); }
    return { opts: unique.map(String), ans: unique.indexOf(String(ans)) };
  }

  function Q(q, optsObj, level, explain, point, fig) {
    return Object.assign({ q, level: level || "基础", explain, point: point || "" }, optsObj, { fig: fig || null });
  }

  /* ============================================================
   * 1. 有理数与数轴（七年级）
   * ============================================================ */
  function qRational(n) {
    const results = [];
    const K = 9;
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 绝对值
        let a; do { a = rnd(-15, 15); } while (a === 0);
        const absA = Math.abs(a);
        o = opts(absA, () => -absA, () => absA + 1, () => absA + 2);
        q = `|${a}| = ？`;
        exp = `绝对值表示数到原点的距离，|${a}| = ${absA}。`;
      } else if (type === 1) {
        // 相反数
        let a; do { a = rnd(-15, 15); } while (a === 0);
        const opp = -a;
        o = opts(opp, () => a, () => opp + 1, () => opp - 1);
        q = `${a} 的相反数是？`;
        exp = `相反数只变符号，${a} 的相反数是 ${opp}。`;
      } else if (type === 2) {
        // 大小比较
        const a = rnd(-9, -1);
        const b = rnd(1, 9);
        o = opts(b, () => a, () => 0, () => rnd(-9, 9));
        q = `比较 ${a} 与 ${b}，较大的数是？`;
        exp = `正数大于负数，${b} > ${a}，较大的是 ${b}。`;
      } else if (type === 3) {
        // 数轴两点距离
        let a, b; do { a = rnd(-12, 12); b = rnd(-12, 12); } while (a === b);
        const dist = Math.abs(a - b);
        o = opts(dist, () => dist + 1, () => dist - 1, () => dist + 2);
        q = `数轴上点 A 表示 ${a}，点 B 表示 ${b}，线段 AB 的长度是？`;
        exp = `AB = |${a} − ${b}| = ${dist}。`;
      } else if (type === 4) {
        // 加法
        const a = rnd(-12, 12), b = rnd(-12, 12);
        const s = a + b;
        o = opts(s, () => s + 1, () => s - 1, () => s + 2);
        q = `${a} + (${b}) = ？`;
        exp = `异号相加取绝对值较大符号：${a} + ${b} = ${s}。`;
      } else if (type === 5) {
        // 减法
        const a = rnd(-12, 12), b = rnd(-12, 12);
        const s = a - b;
        o = opts(s, () => s + 1, () => s - 1, () => s + 2);
        q = `${a} − (${b}) = ？`;
        exp = `减去一个数等于加相反数：${a} − ${b} = ${s}。`;
      } else if (type === 6) {
        // 同号相乘为正
        const a = rnd(2, 9), b = rnd(2, 9);
        const s = a * b;
        o = opts(s, () => -s, () => a + b, () => s + 1);
        q = `(−${a}) × (−${b}) = ？`;
        exp = `负负得正：(−${a}) × (−${b}) = ${s}。`;
      } else if (type === 7) {
        // 倒数
        const a = rnd(2, 12);
        o = opts(`1/${a}`, () => `${a}`, () => `1/${a + 1}`, () => `-1/${a}`);
        q = `${a} 的倒数是？`;
        exp = `乘积为 1 的两个数互为倒数，${a} 的倒数是 1/${a}。`;
      } else {
        // 三数取最大
        const arr = [rnd(-9, 9), rnd(-9, 9), rnd(-9, 9)];
        const mx = Math.max.apply(null, arr);
        o = opts(mx, () => Math.min.apply(null, arr), () => 0, () => arr[0] + arr[1]);
        q = `三个数 ${arr.join("、")} 中最大的是？`;
        exp = `比较大小得最大值是 ${mx}。`;
      }
      results.push(Q(q, o, "基础", exp, "有理数基础"));
    }
    return results;
  }

  /* ============================================================
   * 2. 整式加减（七年级）
   * ============================================================ */
  function qIntegral(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 3;
      let q, ans, o, exp;
      if (type === 0) {
        // 合并同类项
        const a1 = rnd(1, 8), a2 = rnd(1, 8);
        const sum = a1 + a2;
        o = opts(`${sum}x`, () => `${a1 + a2 + 1}x`, () => `${a1}x`, () => `${a2}x`);
        q = `${a1}x + ${a2}x = ？`;
        exp = `同类项合并：系数相加 ${a1} + ${a2} = ${sum}，字母不变。`;
      } else if (type === 1) {
        // 去括号
        const a = rnd(1, 5);
        const b = rnd(1, 9);
        o = opts(`-${a}x + ${b}`, () => `-${a}x - ${b}`, () => `${a}x + ${b}`, () => `${a}x - ${b}`);
        q = `−(${a}x − ${b}) = ？`;
        exp = `括号前是负号，去括号后各项变号：−${a}x + ${b}。`;
      } else {
        // 系数识别
        const a = rnd(2, 9);
        o = opts(`${-a}`, () => `${a}`, () => `${a + 1}`, () => `1`);
        q = `单项式 −${a}x² 的系数是？`;
        exp = `单项式的系数是数字因数，−${a}x² 的系数是 ${-a}。`;
      }
      results.push(Q(q, o, "基础", exp, "整式加减"));
    }
    return results;
  }

  /* ============================================================
   * 3. 一元一次方程（七年级）
   * ============================================================ */
  function qLinear(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 4;
      let q, ans, o, exp;
      if (type === 0) {
        // 简单方程 ax + b = c
        const x = rnd(1, 10);
        const a = rnd(2, 5);
        const b = rnd(1, 10);
        const c = a * x + b;
        o = opts(x, () => x + 1, () => x - 1, () => rnd(1, 12));
        q = `${a}x + ${b} = ${c}，x = ？`;
        exp = `移项：${a}x = ${c} − ${b} = ${c - b}，x = ${c - b} ÷ ${a} = ${x}。`;
      } else if (type === 1) {
        // 去括号方程
        const x = rnd(1, 8);
        const a = rnd(2, 4);
        const b = rnd(1, 6);
        const c = a * (x + b);
        o = opts(x, () => x + 1, () => x - 1, () => rnd(1, 10));
        q = `${a}(x + ${b}) = ${c}，x = ？`;
        exp = `去括号：x + ${b} = ${c} ÷ ${a} = ${c / a}，x = ${c / a} − ${b} = ${x}。`;
      } else if (type === 2) {
        // 应用题（年龄问题）
        const age = rnd(8, 15);
        const years = rnd(5, 15);
        const fatherAge = 2 * age + years; // 保证 fatherAge > 2*age，x = years 为正解
        o = opts(years, () => years + 2, () => years - 2, () => years + 5);
        q = `儿子 ${age} 岁，父亲 ${fatherAge} 岁，几年后父亲年龄是儿子的 2 倍？`;
        exp = `设 x 年后：${fatherAge} + x = 2(${age} + x)，解得 x = ${years}。`;
      } else {
        // 分式方程
        const x = rnd(2, 8);
        const a = rnd(2, 5);
        const b = a * x;
        o = opts(x, () => x + 1, () => x - 1, () => rnd(1, 10));
        q = `${b} ÷ x = ${a}，x = ？`;
        exp = `x = ${b} ÷ ${a} = ${x}。`;
      }
      results.push(Q(q, o, type < 2 ? "基础" : "进阶", exp, "一元一次方程"));
    }
    return results;
  }

  /* ============================================================
   * 4. 一元一次不等式（七年级）
   * ============================================================ */
  function qInequal(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 2;
      let q, ans, o, exp;
      if (type === 0) {
        // 解不等式
        const x = rnd(2, 8);
        const a = rnd(2, 5);
        const b = rnd(1, 10);
        const c = a * x + b;

  /* ============================================================

  /* ============================================================

  /* ============================================================
   * 10. 勾股定理（八年级）
   * ============================================================ */
  function qPyth(n) {
    const results = [];
    const K = 10;
    function triple() {
      const m = rnd(2, 9), nn = rnd(1, m - 1);
      const a = m * m - nn * nn, b = 2 * m * nn, c = m * m + nn * nn;
      return [a, b, c];
    }
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 已知两直角边求斜边
        const [a, b, c] = triple();
        o = opts(c, () => a + b, () => Math.abs(a - b), () => a * b);
        q = `直角三角形两直角边为 ${a} 和 ${b}，斜边为？`;
        exp = `c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a + b*b}，c = ${c}。`;
      } else if (type === 1) {
        // 已知斜边和一直角边求另一直角边
        const [a, b, c] = triple();
        o = opts(b, () => c - a, () => c + a, () => a);
        q = `直角三角形斜边 ${c}，一直角边 ${a}，另一直角边为？`;
        exp = `b² = c² − a² = ${c*c} − ${a*a} = ${c*c - a*a}，b = ${b}。`;
      } else if (type === 2) {
        // 判断直角三角形
        const [a, b, c] = triple();
        o = opts("是直角三角形", () => "不是", () => "无法判断", () => "等边");
        q = `三边长为 ${a}, ${b}, ${c}，这个三角形是？`;
        exp = `${a}² + ${b}² = ${a*a + b*b} = ${c*c}，满足勾股定理，是直角三角形。`;
      } else if (type === 3) {
        // 斜边中线 = 斜边一半
        const c = rnd(4, 20);
        const mid = c / 2;
        o = opts(mid, () => c, () => mid + 1, () => c - 1);
        q = `直角三角形斜边为 ${c}，斜边上的中线长为？`;
        exp = `直角三角形斜边中线 = 斜边一半 = ${c} ÷ 2 = ${mid}。`;
      } else if (type === 4) {
        // 30° 所对直角边 = 斜边一半
        const c = rnd(4, 20);
        o = opts(c / 2, () => c, () => c / 2 + 1, () => c / 4);
        q = `直角三角形中，30° 角所对直角边 = 斜边 ÷ 2，若斜边为 ${c}，则 30° 所对直角边 = ？`;
        exp = `30° 所对直角边 = 斜边 ÷ 2 = ${c} ÷ 2 = ${c / 2}。`;
      } else if (type === 5) {
        // 面积
        const [a, b, c] = triple();
        const area = a * b / 2;
        o = opts(area, () => a * b, () => (a + b) / 2, () => c);
        q = `直角三角形两直角边 ${a}, ${b}，面积为？`;
        exp = `面积 = 两直角边乘积 ÷ 2 = ${a} × ${b} ÷ 2 = ${area}。`;
      } else if (type === 6) {
        // 周长
        const [a, b, c] = triple();
        const per = a + b + c;
        o = opts(per, () => a + b, () => per + 1, () => c + 1);
        q = `直角三角形三边长为 ${a}, ${b}, ${c}，周长为？`;
        exp = `周长 = ${a} + ${b} + ${c} = ${per}。`;
      } else if (type === 7) {
        // 梯子问题
        const [a, b, c] = triple();
        o = opts(b, () => c - a, () => a, () => b + 1);
        q = `一架长 ${c} 的梯子靠墙，底端距墙 ${a}，则墙高 = ？`;
        exp = `墙高 = √(c² − a²) = √(${c*c} − ${a*a}) = √(${c*c - a*a}) = ${b}。`;
      } else if (type === 8) {
        // 坐标系距离
        const [a, b, c] = triple();
        o = opts(c, () => a, () => b, () => c + 1);
        q = `平面直角坐标系中，点 O(0,0) 到点 P(${a},${b}) 的距离是？`;
        exp = `距离 = √(a² + b²) = √(${a*a} + ${b*b}) = √(${c*c}) = ${c}。`;
      } else {
        // 斜边平方
        const [a, b, c] = triple();
        const c2 = a * a + b * b;
        o = opts(c2, () => a * a, () => b * b, () => (a + b) * (a + b));
        q = `直角三角形两直角边 ${a}, ${b}，斜边的平方 c² = ？`;
        exp = `由勾股定理 c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c2}。`;
      }
      results.push(Q(q, o, "基础", exp, "勾股定理"));
    }
    return results;
  }

  /* ============================================================
   * 16. 工程问题（设总量为 1，覆盖小学同名方法以实现题目多样化）
   * ============================================================ */
  function qEngineer(n) {
    const results = [];
    const K = 11;
    const PAIRS = [[6,3],[3,6],[4,4],[12,4],[4,12],[6,6],[8,8],[9,6],[6,9],[12,6],[6,12],[10,15],[15,10],[8,12],[12,8],[5,10],[10,5]];
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 两人合作
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        const coop = a * b / (a + b);
        o = opts(coop, () => coop + 1, () => coop - 1, () => Math.max(a, b));
        q = `一项工程，甲单独做需 ${a} 天，乙单独做需 ${b} 天。两人合作需几天完成？`;
        exp = `合作效率 = 1/${a} + 1/${b} = (${a}+${b})/${a*b}，时间 = ${a*b}/(${a}+${b}) = ${coop} 天。`;
      } else if (type === 1) {
        // 反求乙
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        const coop = a * b / (a + b);
        o = opts(b, () => b + 1, () => b - 1, () => a);
        q = `一项工程，甲单独做需 ${a} 天，甲乙合作需 ${coop} 天。乙单独做需几天？`;
        exp = `1/乙 = 1/${coop} − 1/${a} = (${a} − ${coop})/(${a*coop})，乙 = ${a*coop}/(${a}−${coop}) = ${b} 天。`;
      } else if (type === 2) {
        // 合作比甲单独少用
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        const coop = a * b / (a + b);
        const save = a - coop;
        o = opts(save, () => save + 1, () => save - 1, () => coop);
        q = `甲单独做 ${a} 天，两人合作 ${coop} 天。合作比甲单独少用几天？`;
        exp = `少用 = ${a} − ${coop} = ${save} 天。`;
      } else if (type === 3) {
        // 三人合作（家族 [2k,3k,6k]）
        const k = rnd(1, 4);
        const a = 2 * k, b = 3 * k, c = 6 * k;
        o = opts(k, () => k + 1, () => k - 1, () => a);
        q = `一项工程，甲、乙、丙单独做分别需 ${a}、${b}、${c} 天。三人合作需几天？`;
        exp = `效率和 = 1/${a} + 1/${b} + 1/${c} = 1/${k}，合作需 ${k} 天。`;
      } else if (type === 4) {
        // 三人合作（家族 [2k,4k,4k]）
        const k = rnd(1, 4);
        const a = 2 * k, b = 4 * k, c = 4 * k;
        o = opts(k, () => k + 1, () => k - 1, () => b);
        q = `甲、乙、丙单独做分别需 ${a}、${b}、${c} 天。三人合作需几天？`;
        exp = `效率和 = 1/${a} + 1/${b} + 1/${c} = 1/${k}，合作需 ${k} 天。`;
      } else if (type === 5) {
        // 效率比求甲单独
        const p = rnd(1, 4), e = rnd(1, 4), t = p * rnd(1, 4);
        const aloneA = t * (p + e) / p;
        o = opts(aloneA, () => aloneA + 1, () => aloneA - 1, () => t);
        q = `甲、乙效率比为 ${p}:${e}，合作 ${t} 天完成。甲单独做需几天？`;
        exp = `甲效占总效 p/(p+q)，甲单独 = t × (p+q)/p = ${t} × ${p+e}/${p} = ${aloneA} 天。`;
      } else if (type === 6) {
        // 效率比求乙单独
        const p = rnd(1, 4), e = rnd(1, 4), t = e * rnd(1, 4);
        const aloneB = t * (p + e) / e;
        o = opts(aloneB, () => aloneB + 1, () => aloneB - 1, () => t);
        q = `甲、乙效率比为 ${p}:${e}，合作 ${t} 天完成。乙单独做需几天？`;
        exp = `乙单独 = t × (p+q)/q = ${t} × ${p+e}/${e} = ${aloneB} 天。`;
      } else if (type === 7) {
        // 合作时甲完成比例
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        o = opts(`${b}/(${a}+${b})`, () => `${a}/(${a}+${b})`, () => `1/${a}`, () => `1/${b}`);
        q = `甲单独 ${a} 天、乙单独 ${b} 天，合作完成时甲完成了总工程的几分之几？`;
        exp = `甲完成比例 = 甲效/总效 = (1/${a})/(1/${a}+1/${b}) = ${b}/(${a}+${b})。`;
      } else if (type === 8) {
        // 每天合做量
        const x = rnd(2, 9), y = rnd(2, 9);
        o = opts(x + y, () => x, () => y, () => x * y);
        q = `甲每天做 ${x} 个零件，乙每天做 ${y} 个。两人合作每天共做几个？`;
        exp = `合作每天 = 甲 + 乙 = ${x} + ${y} = ${x + y} 个。`;
      } else if (type === 9) {
        // 合作天数（设总量）
        const x = rnd(2, 9), y = rnd(2, 9), per = x + y;
        const total = per * rnd(2, 6);
        const days = total / per;
        o = opts(days, () => days + 1, () => days - 1, () => total);
        q = `甲每天做 ${x} 个、乙每天做 ${y} 个，共需完成 ${total} 个。两人合作需几天？`;
        exp = `合作每天 ${per} 个，需 ${total} ÷ ${per} = ${days} 天。`;
      } else {
        // 甲先做余下合作
        const x = rnd(2, 9), y = rnd(2, 9), per = x + y;
        const m = rnd(1, 4);
        const total = m * x + per * rnd(1, 5);
        const remain = total - m * x;
        const days = remain / per;
        o = opts(days, () => days + 1, () => days - 1, () => m);
        q = `甲每天做 ${x} 个、乙每天做 ${y} 个。甲先做 ${m} 天，余下两人合作，还需几天完成共 ${total} 个的任务？`;
        exp = `甲先做 ${m*x} 个，余 ${remain} 个；合作每天 ${per} 个，需 ${remain} ÷ ${per} = ${days} 天。`;
      }
      results.push(Q(q, o, "基础", exp, "工程问题"));
    }
    return results;
  }

  /* ============================================================

  /* ============================================================

   * ============================================================ */
  function qComplex(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 4;
      let q, ans, o, exp;
      if (type === 0) {
        // 复数加法
        const a = rnd(1, 5), b = rnd(1, 5);
        const c = rnd(1, 5), d = rnd(1, 5);
        const real = a + c, imag = b + d;
        o = opts(`${real}+${imag}i`, () => `${real + 1}+${imag}i`, () => `${real}+${imag + 1}i`, () => `${a + c}+${b - d}i`);
        q = `( ${a}+${b}i ) + ( ${c}+${d}i ) = ？`;
        exp = `复数加法：实部加实部，虚部加虚部 = (${real}) + (${imag})i。`;
      } else if (type === 1) {
        // 复数乘法
        const a = rnd(1, 3), b = rnd(1, 3);
        const c = rnd(1, 3), d = rnd(1, 3);
        const real = a * c - b * d;
        const imag = a * d + b * c;
        o = opts(`${real}+${imag}i`, () => `${real + 1}+${imag}i`, () => `${real}+${imag + 1}i`, () => `${a * c}+${b * d}i`);
        q = `( ${a}+${b}i ) · ( ${c}+${d}i ) = ？`;
        exp = `复数乘法：(a+bi)(c+di) = (ac−bd) + (ad+bc)i = ${real} + ${imag}i。`;
      } else if (type === 2) {
        // 共轭复数
        const a = rnd(1, 5), b = rnd(1, 5);
        o = opts(`${a}-${b}i`, () => `${a}+${b}i`, () => `-${a}+${b}i`, () => `-${a}-${b}i`);
        q = `复数 z = ${a}+${b}i 的共轭复数是？`;
        exp = `共轭复数实部不变，虚部变号：z̄ = ${a} − ${b}i。`;
      } else {
        // 模长
        const a = rnd(3, 5), b = rnd(3, 5);
        const mod = Math.sqrt(a * a + b * b);
        o = opts(mod.toFixed(1), () => (mod + 1).toFixed(1), () => (mod - 1).toFixed(1), () => (a + b).toFixed(1));
        q = `复数 z = ${a}+${b}i 的模 |z| = ？`;
        exp = `|z| = √(a²+b²) = √(${a*a}+${b*b}) = ${mod.toFixed(1)}。`;
      }
      results.push(Q(q, o, "基础", exp, "复数运算"));
    }
    return results;
  }

  /* ============================================================

      } else if (type === 6) {

  /* ============================================================

  function qStatCase(n) {

      const type = i % 4;
      let q, ans, o, exp;
      if (type === 0) {
        // 平均数
        const vals = [rnd(60, 100), rnd(60, 100), rnd(60, 100), rnd(60, 100)];
        const avg = Math.round(vals.reduce((a, b) => a + b, 0) / 4);
        o = opts(avg, () => avg + 5, () => avg - 5, () => vals[0]);
        q = `数据 ${vals[0]}, ${vals[1]}, ${vals[2]}, ${vals[3]} 的平均数是？`;
        exp = `平均数 = (${vals[0]}+${vals[1]}+${vals[2]}+${vals[3]})/4 = ${avg}。`;
      } else if (type === 1) {
        // 中位数
        const vals = [rnd(10, 50), rnd(51, 90), rnd(91, 130), rnd(131, 170), rnd(171, 200)];
        vals.sort((a, b) => a - b);
        const med = vals[2];
        o = opts(med, () => vals[1], () => vals[3], () => vals[0]);
        q = `数据 ${vals.join(', ')} 的中位数是？`;
        exp = `排序后中间值为 ${med}。`;
      } else if (type === 2) {
        // 方差
        const mean = rnd(50, 100);
        const vals = [mean - rnd(5, 20), mean, mean + rnd(5, 20), mean];
        const variance = Math.round(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / 4);
        o = opts(variance, () => variance + 10, () => variance - 10, () => mean);
        q = `数据 ${vals.join(', ')}（均值 ${mean}）的方差是？`;
        exp = `方差 = [(v₁−μ)²+...+(v₄−μ)²]/4 = ${variance}。`;
      } else {
        // 频率分布
        o = opts("各组频率之和为 1", () => "各组频率之和为 0", () => "各组频数之和为 1", () => "频率可以大于 1");

        exp = `频率分布性质：各组频率之和 = 1，各组频数之和 = 样本容量。`;
      }
      results.push(Q(q, o, "基础", exp, "统计案例"));
    }
    return results;
  }

        q = `(a + b)^${N} 展开中 a^${N - k}b^${k} 项的系数是？`;

        exp = `取 x⁰ 项：C(${N},${N})·x⁰·1^${N} = 1，常数项为 1。`;
      } else if (type === 4) {
        const N = rnd(2, 9);
        o = opts(`2^${N}`, () => `${N}`, () => `${N + 1}`, () => `${2 * N}`);

      } else if (type === 5) {

      } else if (type === 6) {

        q = `(a + b)^${N} 展开中二项式系数最大的那一项系数是？`;

      } else if (type === 7) {

        q = `(1 − x)^${N} 展开中 x^${k} 项的系数是？`;
        exp = `(1−x)^${N} = Σ (−1)^k C(${N},k) x^k，x^${k} 系数 = ${sign}${c}。`;
      } else if (type === 8) {
        const N = rnd(3, 7), k = rnd(1, N - 1);
        const c = comb(N, k);
        const val = c * Math.pow(2, N - k);
        o = opts(`${val}`, () => `${c}`, () => `${c * Math.pow(2, k)}`, () => `${N}`);
        q = `(x + 2)^${N} 展开中 x^${k} 项的系数是？`;
        exp = `项为 C(${N},${k})·x^${k}·2^${N - k}，系数 = ${c}·2^${N - k} = ${val}。`;
      } else {

  function qInclusion(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const A = rnd(10, 30), B = rnd(10, 30), I = rnd(1, Math.min(A, B));
        o = opts(`${A + B - I}`, () => `${A + B}`, () => `${I}`, () => `${A + B + I}`);
        q = `班中 ${A} 人会英语、${B} 人会日语，两种都会的 ${I} 人，至少会一种的有几人？`;

      } else if (type === 1) {

        o = opts(`|A| + |B| − |A∩B|`, () => `|A| + |B|`, () => `|A|·|B|`, () => `|A∩B|`);
        q = `集合 A 有 ${A} 个元素、B 有 ${B} 个元素，两集合容斥原理 |A∪B| = ？`;

      } else if (type === 2) {
        const A = rnd(5, 15), B = rnd(5, 15), C = rnd(5, 15);
        o = opts(`+ |A∩B∩C|`, () => `0`, () => `− |A∩B∩C|`, () => `|A|·|B|·|C|`);
        q = `三集合 A(${A}个)、B(${B}个)、C(${C}个)，|A∪B∪C| = |A|+|B|+|C| − (两两交之和) + ？`;

        exp = `被${a}整除 ${Math.floor(N / a)} 个、被${b}整除 ${Math.floor(N / b)} 个、被${a * b}整除 ${Math.floor(N / (a * b))} 个 → 容斥得 ${cnt}。`;
      } else if (type === 4) {
        const N = rnd(50, 120), a = rnd(2, 4), b = rnd(4, 7);
        const cnt = Math.floor(N / a) + Math.floor(N / b) - Math.floor(N / (a * b));
        o = opts(`${N - cnt}`, () => `${cnt}`, () => `${N}`, () => `${N - cnt - 1}`);
        q = `1 到 ${N} 中既不能被 ${a} 整除也不能被 ${b} 整除的数有几个？`;
        exp = `总数 ${N} 减去「能被 ${a} 或 ${b} 整除」的 ${cnt} 个，余 ${N - cnt} 个。`;
      } else if (type === 5) {
        const A = rnd(10, 20), B = rnd(10, 20), C = rnd(10, 20);
        const ab = rnd(1, Math.min(A, B)), ac = rnd(1, Math.min(A, C)), bc = rnd(1, Math.min(B, C)), abc = rnd(1, Math.min(ab, bc, ac));
        const u = A + B + C - (ab + ac + bc) + abc;
        o = opts(`${u}`, () => `${A + B + C}`, () => `${A + B + C - (ab + ac + bc)}`, () => `${u - 1}`);
        q = `|A|=${A},|B|=${B},|C|=${C}，两两交 ${ab},${ac},${bc}，三者交 ${abc}，则 |A∪B∪C| = ？`;
        exp = `三集合容斥：${A}+${B}+${C}−(${ab}+${ac}+${bc})+${abc} = ${u}。`;
      } else if (type === 6) {
        const A = rnd(10, 30), B = rnd(10, 30), I = rnd(1, Math.min(A, B));
        o = opts(`${A - I}`, () => `${A}`, () => `${I}`, () => `${B - I}`);
        q = `班中 ${A} 人会英语、${B} 人会日语、都会 ${I} 人，则只会英语的有几人？`;

      } else if (type === 8) {
        const A = rnd(8, 16), B = rnd(8, 16), C = rnd(8, 16);
        const ab = rnd(1, Math.min(A, B)), ac = rnd(1, Math.min(A, C)), bc = rnd(1, Math.min(B, C)), abc = rnd(1, Math.min(ab, ac, bc));
        const u = A + B + C - (ab + ac + bc) + abc;
        o = opts(`${u}`, () => `${A + B + C}`, () => `${u + 1}`, () => `${A + B + C - abc}`);
        q = `三集合 |A|=${A},|B|=${B},|C|=${C}，两两交 ${ab}/${ac}/${bc}，三者交 ${abc}，并集大小是？`;
        exp = `|A∪B∪C| = ${A}+${B}+${C}−${ab}−${ac}−${bc}+${abc} = ${u}。`;
      } else {
        const A = rnd(10, 30), B = rnd(10, 30), I = rnd(1, Math.min(A, B));
        o = opts(`${A + B - I}`, () => `${A}`, () => `${B}`, () => `${I}`);
        q = `总体 ${A + B} 人中，会英语 ${A} 人、会日语 ${B} 人、都会 ${I} 人，则两种都不会的有几人？`;
        exp = `至少会一种 = ${A}+${B}−${I} = ${A + B - I}，两种都不会 = ${A + B} − ${A + B - I} = ${I} 人。`;
      }
      results.push(Q(q, o, "进阶", exp, "容斥原理", "inclusion_venn"));
    }
    return results;
  }

  function qRecurrence(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const A = rnd(1, 5), r = rnd(2, 4), N = rnd(3, 6);
        const val = A * Math.pow(r, N - 1);
        o = opts(`${val}`, () => `${A * Math.pow(r, N)}`, () => `${val + 1}`, () => `${A + (N - 1) * r}`);
        q = `等比数列 a₁ = ${A}，a_{n+1} = ${r}a_n，则 a_${N} = ？`;
        exp = `a_n = ${A}·${r}^{n−1}，a_${N} = ${A}·${r}^{${N}−1} = ${val}。`;
      } else if (type === 1) {
        const A = rnd(1, 5), d = rnd(2, 6), N = rnd(3, 7);
        const val = A + (N - 1) * d;
        o = opts(`${val}`, () => `${A + N * d}`, () => `${val - 1}`, () => `${A * N}`);
        q = `等差数列 a₁ = ${A}，a_{n+1} = a_n + ${d}，则 a_${N} = ？`;
        exp = `a_n = ${A} + (n−1)·${d}，a_${N} = ${A} + ${N - 1}·${d} = ${val}。`;
      } else if (type === 2) {
        const A = rnd(1, 4), r = rnd(2, 3), c = rnd(1, 4), N = rnd(3, 6);

        q = `数列 a₁ = ${A}，a_{n+1} = ${r}a_n + ${c}，则 a_${N} = ？`;
        exp = `逐项递推 ${N - 1} 次得 a_${N} = ${v}。`;
      } else if (type === 3) {
        const A = rnd(1, 5), B = rnd(6, 12), N = rnd(3, 6);

        q = `等差数列 a₁ = ${A}, a₂ = ${B}（公差 ${d}），则 a_${N} = ？`;
        exp = `公差 d = ${B}−${A} = ${d}，a_${N} = ${A} + ${N - 1}·${d} = ${val}。`;
      } else if (type === 4) {
        const A = rnd(1, 5), r = rnd(2, 4), N = rnd(3, 6);
        const val = A * (1 - Math.pow(r, N)) / (1 - r);
        o = opts(`${val}`, () => `${val + 1}`, () => `${A * Math.pow(r, N)}`, () => `${A * N}`);
        q = `等比数列 a₁ = ${A}，公比 ${r}，则前 ${N} 项和 S_${N} = ？`;
        exp = `S_${N} = ${A}(1−${r}^${N})/(1−${r}) = ${val}。`;
      } else if (type === 5) {
        const A = rnd(1, 4), B = rnd(1, 4), N = rnd(4, 7);
        let x = A, y = B; for (let j = 3; j <= N; j++) { const t = x + y; x = y; y = t; }
        o = opts(`${y}`, () => `${y + 1}`, () => `${x}`, () => `${A + B}`);
        q = `数列 a₁ = ${A}, a₂ = ${B}，且 a_{n+2} = a_{n+1} + a_n（类斐波那契），则 a_${N} = ？`;
        exp = `递推得 a_${N} = ${y}。`;
      } else if (type === 6) {
        const X = rnd(5, 20), d = rnd(2, 6), m = rnd(2, 5), k = rnd(1, 4);
        o = opts(`${X + k * d}`, () => `${X + (k - 1) * d}`, () => `${X}`, () => `${X * 2}`);
        q = `等差数列中已知 a_${m} = ${X}，公差 ${d}，则 a_${m + k} = ？`;
        exp = `a_${m + k} = a_${m} + ${k}·${d} = ${X} + ${k * d} = ${X + k * d}。`;
      } else if (type === 7) {
        const A = rnd(1, 5), d = rnd(2, 6), N = rnd(3, 7);
        const val = N * (2 * A + (N - 1) * d) / 2;
        o = opts(`${val}`, () => `${val + 1}`, () => `${A * N + d}`, () => `${N * (A + (N - 1) * d)}`);
        q = `等差数列 a₁ = ${A}，公差 ${d}，则前 ${N} 项和 S_${N} = ？`;
        exp = `S_${N} = ${N}(2·${A} + (${N}−1)·${d})/2 = ${val}。`;
      } else if (type === 8) {
        const r = rnd(2, 4), N = rnd(3, 6), Y = rnd(8, 40);
        const a1 = Y / Math.pow(r, N - 1);
        o = opts(`${a1}`, () => `${a1 + 1}`, () => `${Y}`, () => `${a1 - 1}`);
        q = `等比数列公比 ${r}，已知 a_${N} = ${Y}，则首项 a₁ = ？`;
        exp = `a_${N} = a₁·${r}^{${N}−1} = ${Y} ⇒ a₁ = ${Y}/${Math.pow(r, N - 1)} = ${a1}。`;
      } else {
        const A = rnd(1, 3), B = rnd(1, 3), N = rnd(4, 7);
        let x = A, y = B; for (let j = 3; j <= N; j++) { const t = x + y; x = y; y = t; }
        o = opts(`${y}`, () => `${y + 1}`, () => `${x}`, () => `${A + B}`);
        q = `数列 a₁ = ${A}, a₂ = ${B}，a_{n+2} = a_{n+1} + a_n，求 a_${N} = ？`;
        exp = `递推得 a_${N} = ${y}。`;
      }
      results.push(Q(q, o, "进阶", exp, "递推数列", "recurrence_tree"));

    return results;

  /* ============================================================
   * 拓展专题（第二批）：树状图法、排列组合、柯西不等式、

  function qTree(n) {
    const results = [];
    const comb = (N, K) => { let c = 1; for (let j = 0; j < K; j++) c = c * (N - j) / (j + 1); return c; };
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const a = rnd(2, 5), b = rnd(2, 5);
        o = opts(`${a * b} 种`, () => `${a + b} 种`, () => `${a} 种`, () => `${a * b + 1} 种`);
        q = `有 ${a} 件上衣、${b} 条裤子，各选一件共有几种搭配（树状图逐层展开）？`;
        exp = `分步乘法原理：${a} × ${b} = ${a * b} 种。`;
      } else if (type === 1) {
        const k = rnd(2, 5);
        const total = Math.pow(2, k);
        o = opts(`${total} 种`, () => `${k} 种`, () => `${2 * k} 种`, () => `${k * k} 种`);
        q = `一枚硬币连续抛 ${k} 次，所有可能的结果序列有几种？`;
        exp = `每步 2 种，逐层翻倍共 2^${k} = ${total} 种（树状图逐层展开）。`;
      } else if (type === 2) {
        const k = rnd(2, 5);
        o = opts(`1 − 1/2^${k}`, () => `1/2^${k}`, () => `1/2`, () => `1`);
        q = `硬币抛 ${k} 次，至少出现 1 次正面的概率是？`;
        exp = `全反面的概率为 1/2^${k}，故至少 1 次正面 = 1 − 1/2^${k}。`;
      } else if (type === 3) {
        const S = rnd(2, 12);
        const cnt = (S <= 7) ? S - 1 : 13 - S;
        o = opts(`${cnt}/36`, () => `${cnt + 1}/36`, () => `${cnt - 1}/36`, () => `${cnt}/6`);
        q = `同时掷两枚均匀骰子，点数之和为 ${S} 的概率是？`;
        exp = `36 种等可能，和为 ${S} 有 ${cnt} 种，概率 = ${cnt}/36。`;
      } else if (type === 4) {
        const k = rnd(3, 6), m = rnd(1, k - 1);
        const cnt = comb(k, m);
        o = opts(`${cnt}/2^${k}`, () => `${cnt + 1}/2^${k}`, () => `1/2^${k}`, () => `${cnt}/2^${k - 1}`);
        q = `硬币抛 ${k} 次，恰好出现 ${m} 次正面的概率是（用树状图/二项）？`;
        exp = `C(${k},${m}) 种正面位置，概率 = C(${k},${m})/2^${k} = ${cnt}/2^${k}。`;
      } else if (type === 5) {
        const R = rnd(2, 6), B = rnd(2, 6);
        o = opts(`${R}/${R + B}`, () => `${B}/${R + B}`, () => `${R}/(R + B + 1)`, () => `1/2`);
        q = `盒中有 ${R} 个红球、${B} 个蓝球，随机取 1 个，取到红球的概率是？`;
        exp = `共 ${R + B} 个球，红球 ${R} 个，概率 = ${R}/${R + B}。`;
      } else if (type === 6) {
        const R = rnd(2, 5), B = rnd(2, 5);
        const p = (R / (R + B)) * (B / (R + B - 1));
        o = opts(`${p.toFixed(3)}`, () => `${(p + 0.1).toFixed(3)}`, () => `${(R / (R + B)).toFixed(3)}`, () => `${(B / (R + B)).toFixed(3)}`);
        q = `盒中 ${R} 红 ${B} 蓝，不放回依次取 2 个，先红后蓝的概率是？`;
        exp = `P = (${R}/${R + B}) × (${B}/${R + B - 1}) ≈ ${p.toFixed(3)}。`;
      } else if (type === 7) {
        const T = rnd(1, 5);
        o = opts(`${(6 - T)}/6`, () => `${T}/6`, () => `${(6 - T + 1)}/6`, () => `1/6`);
        q = `掷一枚均匀骰子，点数大于 ${T} 的概率是？`;
        exp = `点数 ${T + 1},…,6 共 ${6 - T} 种，概率 = ${6 - T}/6。`;
      } else if (type === 8) {
        const a = rnd(2, 5), b = rnd(2, 5);
        o = opts(`${a * b}`, () => `${a + b}`, () => `${a}`, () => `${a * b - 1}`);
        q = `用树状图：第一阶段有 ${a} 种选择，第二阶段各有 ${b} 种，总路径数是？`;
        exp = `乘法原理：总路径 = ${a} × ${b} = ${a * b}。`;
      } else {
        const R = rnd(2, 5), B = rnd(2, 5);
        const p = Math.pow(R / (R + B), 2);
        o = opts(`${p.toFixed(3)}`, () => `${(p + 0.1).toFixed(3)}`, () => `${(R / (R + B)).toFixed(3)}`, () => `${(B / (R + B)).toFixed(3)}`);
        q = `盒中 ${R} 红 ${B} 蓝，有放回取 2 次，两次都是红球的概率是？`;
        exp = `每次红球概率 ${R}/${R + B}，放回独立，P = (${R}/${R + B})² ≈ ${p.toFixed(3)}。`;
      }
      results.push(Q(q, o, "基础", exp, "树状图法", "tree_diagram"));
    }
    return results;
  }

  function qCounting(n) {
    const results = [];
    const comb = (N, K) => { let c = 1; for (let j = 0; j < K; j++) c = c * (N - j) / (j + 1); return c; };
    for (let i = 0; i < n; i++) {

      if (type === 0) {

  /* ---------- 拓展：琴生不等式与凸函数（jensen） ---------- */

  /* ---------- 拓展：棣莫弗定理（de_moivre） ---------- */

  /* ============================================================

  function qHypothesis(n) {

      } else if (type === 3) {
        const mu = rnd(50, 150);

        q = `检验 H0: μ=${mu}，第一类错误（α 错误）是指？`;
        exp = `第一类错误 = 弃真：H0 真却拒绝。`;
      } else if (type === 4) {
        const mu = rnd(50, 150);

  /* ============================================================

  function qImproperInt(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const p = rnd(2, 15);
        const v = (1 / (p - 1)).toFixed(3);
        o = opts(`${v}`, () => `∞`, () => `0`, () => `${(1 / p).toFixed(3)}`);
        q = `反常积分 ∫₁^∞ 1/x^${p} dx = ？`;
        exp = `[−1/(${p - 1})x^{${p - 1}}]₁^∞ = 0 − (−1/(${p - 1})) = ${v}。`;
      } else if (type === 1) {
        const a = rnd(2, 15);
        o = opts("发散（∞）", () => `收敛到 1`, () => `收敛到 ln${a}`, () => `收敛到 0`);
        q = `反常积分 ∫${a}^∞ 1/x dx 的敛散性？`;
        exp = `[ln x]${a}^∞ = ∞，发散。`;
      } else if (type === 2) {
        const qe = rnd(1, 9) / 10;
        const v = (1 / (1 - qe)).toFixed(3);
        o = opts(`${v}`, () => `1`, () => `∞`, () => `${(1 / qe).toFixed(3)}`);
        q = `反常积分 ∫₀¹ 1/x^${qe.toFixed(1)} dx = ？`;
        exp = `[x^{${(1 - qe).toFixed(1)}}/${(1 - qe).toFixed(1)}]₀¹ = ${v}（收敛）。`;
      } else if (type === 3) {
        const p = rnd(1, 15) / 2;
        o = opts("p > 1", () => "p ≥ 1", () => "p > 0", () => "p < 1");
        q = `积分 ∫₁^∞ 1/x^${p.toFixed(1)} dx 收敛的充要条件是？`;
        exp = `p>1 收敛于 1/(p−1)；p≤1 发散。`;
      } else if (type === 4) {
        const k = rnd(1, 12);
        o = opts("1", () => "0", () => `${k}`, () => "∞");
        q = `反常积分 ∫₀^∞ ${k}e^(−${k}x) dx = ？`;
        exp = `∫₀^∞ ${k}e^{−${k}x} dx = [−e^{−${k}x}]₀^∞ = 0 − (−1) = 1。`;
      } else if (type === 5) {
        const a = rnd(1, 9);
        o = opts("π", () => `${Math.PI / 2}`, () => `2π`, () => `${a}π`);
        q = `反常积分 ∫_{−∞}^∞ ${a}/(${a * a}+x²) dx = ？`;
        exp = `[arctan(x/${a})]_{−∞}^∞ = π/2 − (−π/2) = π。`;
      } else if (type === 6) {
        const a = rnd(2, 15);
        o = opts("发散", () => `收敛到 1`, () => `收敛到 0`, () => `收敛到 ln${a}`);
        q = `反常积分 ∫₀^${a} 1/x dx 的敛散性？`;
        exp = `[ln x]₀^${a} = ∞，在 0 处发散。`;
      } else if (type === 7) {
        const a = rnd(2, 15);
        const v = (1 / Math.log(a)).toFixed(3);
        o = opts(`${v}`, () => `∞`, () => `${Math.log(a).toFixed(3)}`, () => `1`);
        q = `反常积分 ∫${a}^∞ 1/[x(ln x)²] dx 收敛到？`;
        exp = `令 u=ln x：∫_{ln ${a}}^∞ u^{−2} du = [−1/u] = 1/ln ${a} ≈ ${v}。`;
      } else if (type === 8) {
        const p = rnd(2, 6);
        const v = (1 / ((p - 1) * Math.pow(2, p - 1))).toFixed(3);
        o = opts(`${v}`, () => `∞`, () => `0`, () => `1`);
        q = `反常积分 ∫₂^∞ 1/x^${p} dx = ？`;
        exp = `[−1/(${p - 1})x^{${p - 1}}]₂^∞ = 1/(${p - 1})·2^{−${p - 1}} = ${v}。`;
      } else {
        const k = rnd(1, 5);
        const v = (1 / k).toFixed(3);
        o = opts(`${v}`, () => `1`, () => `0`, () => `∞`);
        q = `反常积分 ∫₀^∞ e^(−${k}x) dx = ？`;
        exp = `[−e^(−${k}x)/${k}]₀^∞ = 1/${k} = ${v}。`;
      }
      results.push(Q(q, o, "进阶", exp, "反常积分"));
    }
    return results;
  }

  /* ============================================================

  function qPartialDeriv(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const a = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = 2 * a * X * Y;
        o = opts(`${v}`, () => `${a * X * Y}`, () => `${2 * a * X}`, () => `${Y}`);
        q = `f(x,y)=${a}x²y，求 ∂f/∂x 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂x = 2${a}xy = 2·${a}·${X}·${Y} = ${v}。`;
      } else if (type === 1) {
        const a = rnd(1, 6), X = rnd(1, 5);
        const v = a * X * X;
        o = opts(`${v}`, () => `${2 * a * X}`, () => `${a}`, () => `${2 * a * v}`);
        q = `f(x,y)=${a}x²y，求 ∂f/∂y 在 (${X},${rnd(1, 5)}) 的值 = ？`;
        exp = `∂f/∂y = ${a}x² = ${a}·${X}² = ${v}。`;
      } else if (type === 2) {
        const a = rnd(1, 6), b = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = 2 * a * X + b * Y;
        o = opts(`${v}`, () => `${2 * a * X}`, () => `${a * X + b * Y}`, () => `${b * Y}`);
        q = `f(x,y)=${a}x²+${b}xy，求 ∂f/∂x 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂x = 2${a}x+${b}y = 2·${a}·${X}+${b}·${Y} = ${v}。`;
      } else if (type === 3) {
        const nn = rnd(2, 4);
        o = opts("相等", () => "互为相反数", () => "无关", () => "相差一个常数");
        q = `若 ${nn} 元函数二阶混合偏导连续，则 ∂²f/∂x∂y 与 ∂²f/∂y∂x 的关系是？`;
        exp = `克莱罗定理：连续时混合偏导相等。`;
      } else if (type === 4) {
        const a = rnd(1, 6), b = rnd(1, 6);
        o = opts("(∂f/∂x)dx + (∂f/∂y)dy", () => "∂f/∂x + ∂f/∂y", () => "(∂f/∂x)(∂f/∂y)", () => "dx+dy");
        q = `二元函数 f(x,y)=${a}x²+${b}y² 的全微分 df = ？`;
        exp = `df = f_x dx + f_y dy = 2${a}x dx + 2${b}y dy（形式即 f_x dx + f_y dy）。`;
      } else if (type === 5) {
        const a = rnd(1, 5), X = rnd(1, 4), Y = rnd(1, 4);
        const v = (a * Y * Math.exp(a * X * Y)).toFixed(3);
        o = opts(`${v}`, () => `${(X * Math.exp(a * X * Y)).toFixed(3)}`, () => `${(Math.exp(a * X * Y)).toFixed(3)}`, () => `${(a * X * Y * Math.exp(a * X * Y)).toFixed(3)}`);
        q = `f(x,y)=e^(${a}xy)，求 ∂f/∂x 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂x = e^{${a}xy}·${a}y = ${a}·${Y}·e^{${a}·${X}·${Y}} ≈ ${v}。`;
      } else if (type === 6) {
        const a = rnd(1, 9);
        o = opts("曲面沿 x 方向切线的斜率", () => "曲面法向量", () => "体积变化率", () => "面积");
        q = `偏导数 ∂f/∂x（如 f(x,y)=x²+y²+${a}）的几何意义是？`;
        exp = `固定 y=y0，曲面截线对 x 的切线斜率。`;
      } else if (type === 7) {
        const P = rnd(1, 6), Q = rnd(1, 6);
        o = opts(`(${P},${Q})`, () => `(${Q},${P})`, () => `(0,0)`, () => `(${P + Q},${P})`);
        q = `f(x,y)=x²+y²−2${P}x−2${Q}y 的唯一驻点是？`;
        exp = `f_x=2x−2${P}=0, f_y=2y−2${Q}=0 → x=${P}, y=${Q}，驻点(${P},${Q})。`;
      } else if (type === 8) {
        const a = rnd(1, 6), b = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = 2 * b * Y + a * X;
        o = opts(`${v}`, () => `${2 * b * Y}`, () => `${a * X + b * Y}`, () => `${a * X}`);
        q = `f(x,y)=${a}xy+${b}y²，求 ∂f/∂y 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂y = ${a}x+2${b}y = ${a}·${X}+2·${b}·${Y} = ${v}。`;
      } else {
        const c = rnd(1, 6), d = rnd(1, 6);

        o = opts(`${v}`, () => `${c}`, () => `${d}`, () => `${(c / d).toFixed(3)}`);

      }
      results.push(Q(q, o, "进阶", exp, "多元函数偏导"));
    }
    return results;
  }

        exp = `∇f = (${c}y, ${c}x)，在 (${X},${Y}) 为 (${c * Y}, ${c * X})，模 ${Math.sqrt(c * c * (X * X + Y * Y)).toFixed(2)}。`;
      } else if (type === 6) {

      } else if (type === 7) {
        const p = rnd(1, 9), q2 = rnd(1, 9);

    if (type === 4) {
      const k = rnd(3, 8), q = rnd(3, 12), r = rnd(1, k - 1), N = k * q + r, askR = rnd(0, 1), ans = askR ? r : q;
      return Q(`把 ${N} 本书平均分给 ${k} 个小组，每组分得同样多。${askR ? "最后还剩几本" : "每组分得多少本"}？`, opts(ans, () => rnd(1, 15)), "基础",
        `${N}÷${k}=${q}……${r}，每组 ${q} 本，还剩 ${r} 本。所以答案是 ${ans}。`, "平均分", null);
    }
    if (type === 5) {
      const d = rnd(4, 9), r = rnd(1, d - 1), ans = d - r;
      return Q(`一个数除以 ${d} 余 ${r}，这个数至少再加上几就能被 ${d} 整除？`, opts(ans, () => rnd(1, 10)), "拔高",

    }
    if (type === 6) {
      const d = rnd(3, 9), q = rnd(3, 12), ans = d * q;
      return Q(`在括号里填数：( ) ÷ ${d} = ${q}`, opts(ans, () => ans + rnd(-10, 10)), "基础",

    if (type === 7) {
      const d = rnd(3, 9), q = rnd(4, 15), N = d * q;
